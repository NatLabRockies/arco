[package]
name = "arco-cli"
version = { workspace = true }
description = "CLI compiler and solver for KDL optimization models"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license-file = "licenses/BSD-3-Clause.txt"
publish = false
autobins = false
default-run = "arco"

[package.metadata.dist]
# This is the main distributable artifact
dist = true
# Release binaries should include Xpress support; the runtime library is loaded dynamically.
features = ["xpress"]

[package.metadata.wix]
upgrade-guid = "7924A5C1-504F-4FA6-B082-45D003C9FE07"
path-guid = "B7F04BFA-741F-4FEE-93A6-A5071B74EEA0"
license = false
eula = false

[[bin]]
name = "arco"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arco-diagnostics = { workspace = true }
arco-ops = { workspace = true }
clap = { version = "4", features = ["derive"] }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.25"
sysinfo = { workspace = true }
similar = "3"
thiserror = "2.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
owo-colors = "4"

[dev-dependencies]
csv = "1.4"
toml = { workspace = true }

[features]
default = []
ipopt = ["arco-ops/ipopt"]
xpress = ["arco-ops/xpress"]
