[package]
name = "arco-ops"
version = { workspace = true }
description = "Operations facade seam for Arco interaction surfaces"
edition = { workspace = true }
rust-version = { workspace = true }
license-file = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
publish = false

[lints]
workspace = true

[dependencies]
arco-model = { workspace = true }
arco-format = { workspace = true }
arco-highs = { workspace = true }
arco-ipopt = { workspace = true, optional = true }
arco-kdl = { workspace = true }
arco-scip = { workspace = true }
arco-solver = { workspace = true }
arco-validate = { workspace = true }
csv = "1.4"
ipopt = { version = "0.5", optional = true }
miette = { version = "7", features = ["fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22"
thiserror = "2.0"
tracing = { workspace = true }

[features]
default = []
ipopt = ["dep:arco-ipopt", "dep:ipopt"]
xpress = []
