[package]
name = "arco-highs"
version = { workspace = true }
description = "HiGHS solver adapter for Arco model views"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license-file = { workspace = true }
publish = false

[lints]
workspace = true

[dependencies]
arco-solver = { workspace = true, default-features = false }
arco-model = { workspace = true, default-features = false }
highs-sys = { version = "=1.15.0", features = ["discover"], optional = true }
tracing = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true, features = ["fmt"] }

[features]
default = ["bundled-highs"]
bundled-highs = ["dep:highs-sys"]
