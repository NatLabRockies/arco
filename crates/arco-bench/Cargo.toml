[package]
name = "arco-bench"
version = { workspace = true }
description = "Benchmark runner and reporting interface for Arco"
edition = { workspace = true }
rust-version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
license-file = { workspace = true }
readme = "README.md"
publish = false

[lints]
workspace = true

[features]
default = []
torc = ["dep:torc", "dep:reqwest"]

[dependencies]
arco-core = { workspace = true }
arco-expr = { workspace = true }
arco-kdl = { workspace = true }
arco-tools = { workspace = true }
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

[dependencies.torc]
git = "https://github.com/NatLabRockies/torc"
# TODO: Replace with actual HEAD commit hash from torc repo
# rev = "0000000000000000000000000000000000000000"
optional = true

[dependencies.reqwest]
version = "0.12"
optional = true
features = ["json"]
