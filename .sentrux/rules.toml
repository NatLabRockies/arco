# Target-state architectural rules for Arco.
#
# Arco is modeled as:
#
#   authoring surfaces -> canonical model -> compilation -> [portable IR | direct solver sink]
#   interaction surfaces -> solver platform
#   portable IR -> exchange
#
# This is a future-state canvas optimized for correctness, growth, and
# performance-aware direct-build solver paths.
#
# Current and future crate names are listed side-by-side where useful
# (for example arco-core/arco-model, arco-lower/arco-compile,
# arco-export/arco-exchange).

[constraints]
max_cycles = 0
max_coupling = "C"
max_cc = 25
no_god_files = false

[[layers]]
name = "interaction_surfaces"
paths = [
  "crates/arco-cli/src/**",
  "bindings/python/src/**",
]
order = 0

[[layers]]
name = "operations_facade"
paths = [
  "crates/arco-ops/src/**",
]
order = 1

[[layers]]
name = "authoring_surfaces"
paths = [
  "crates/arco-kdl/src/**",
  "crates/arco-json/src/**",
  "crates/arco-yaml/src/**",
]
order = 4

[[layers]]
name = "solver_platform"
paths = [
  "crates/arco-solver/src/**",
]
order = 5

[[layers]]
name = "solver_adapters"
paths = [
  "crates/arco-highs/src/**",
  "crates/arco-ipopt/src/**",
  "crates/arco-xpress/src/**",
  "crates/arco-scip/src/**",
]
order = 6

[[layers]]
name = "exchange"
paths = [
  "crates/arco-exchange/src/**",
  "crates/arco-export/src/**",
]
order = 7

[[layers]]
name = "compilation"
paths = [
  "crates/arco-compile/src/**",
  "crates/arco-lower/src/**",
]
order = 3

[[layers]]
name = "validation"
paths = [
  "crates/arco-validate/src/**",
]
order = 9

[[layers]]
name = "support_tooling"
paths = [
  "crates/arco-tools/src/**",
]
order = 10

[[layers]]
name = "canonical_model"
paths = [
  "crates/arco-model/src/**",
  "crates/arco-algebra/src/**",
  "crates/arco-expr/src/**",
  "crates/arco-blocks/src/**",
]
order = 11

[[layers]]
name = "solver_targets"
paths = [
  "crates/arco-targets/src/**",
]
order = 12

[[layers]]
name = "portable_ir"
paths = [
  "crates/arco-ir/src/**",
]
order = 13

[[layers]]
name = "shared_interfaces"
paths = [
  "crates/arco-contracts/src/**",
]
order = 14

[[layers]]
name = "runtime_execution"
paths = [
  "crates/arco-runtime/src/**",
]
order = 15

# Authoring surfaces build the canonical model. They must not own compilation,
# solver policy, runtime execution, portable exchange, or concrete solver wiring.
[[boundaries]]
from = "crates/arco-kdl/src/**"
to = "crates/arco-compile/src/**"
reason = "Authoring surfaces must build the canonical model, not own compilation"

[[boundaries]]
from = "crates/arco-kdl/src/**"
to = "crates/arco-lower/src/**"
reason = "Authoring surfaces must build the canonical model, not own compilation"

[[boundaries]]
from = "crates/arco-kdl/src/**"
