- name: Install Rust toolchain manager
  shell: bash
  run: |
    set -euo pipefail

    if command -v rustup >/dev/null 2>&1; then
      exit 0
    fi

    for attempt in 1 2 3 4 5; do
      if curl --proto '=https' --tlsv1.2 -LsSf https://sh.rustup.rs -o /tmp/rustup-init.sh; then
        sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        exit 0
      fi
      sleep $((attempt * 5))
    done

    echo "failed to download rustup installer after 5 attempts" >&2
    exit 1

- name: Use workspace Rust toolchain
  run: rustup update "1.85" --no-self-update && rustup default "1.85"

- name: Configure manylinux native dependency builds
  if: ${{ matrix.container && contains(join(matrix.targets, ','), 'x86_64-unknown-linux-gnu') }}
  shell: bash
  run: bash ./scripts/setup_manylinux_native_deps.sh "$GITHUB_ENV"

- name: Restore HiGHS native cache
  id: highs-cache-restore
  uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
  with:
    path: ~/.cache/arco-highs
    key: ${{ runner.os }}-highs-${{ hashFiles('scripts/setup_highs_binary_env.sh') }}
    restore-keys: |
      ${{ runner.os }}-highs-

- name: Configure HiGHS static binary discovery
  shell: bash
  env:
    ARCO_HIGHS_TARGETS: ${{ join(matrix.targets, ',') }}
  run: bash ./scripts/setup_highs_binary_env.sh "$GITHUB_ENV"

- name: Save HiGHS native cache
  if: ${{ steps.highs-cache-restore.outputs.cache-hit != 'true' }}
  uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
  with:
    path: ~/.cache/arco-highs
    key: ${{ runner.os }}-highs-${{ hashFiles('scripts/setup_highs_binary_env.sh') }}

- name: Configure SCIP bundled binary discovery
  shell: bash
  env:
    ARCO_SCIP_TARGETS: ${{ join(matrix.targets, ',') }}
  run: bash ./scripts/setup_scip_binary_env.sh "$GITHUB_ENV"

- name: Install uv for solver runtime setup
  uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
  with:
    version: "0.9.4"
    enable-cache: false

- name: Set up Xpress runtime
  shell: bash
  env:
    XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
    XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
    XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
  run: |
    set -euo pipefail
    bash ./scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"

- name: Validate XPRESSDIR for xpress-enabled dist builds (Unix)
  if: runner.os != 'Windows'
  shell: bash
  run: |
    set -euo pipefail
    if [[ -z "${XPRESSDIR:-}" ]]; then
      echo "XPRESSDIR is unset. Configure XPRESS_SDK_*_URL repository variables for this runner OS." >&2
      exit 1
    fi

- name: Validate XPRESSDIR for xpress-enabled dist builds (Windows)
  if: runner.os == 'Windows'
  shell: pwsh
  run: |
    if (-not $env:XPRESSDIR) {
      Write-Error 'XPRESSDIR is unset. Configure XPRESS_SDK_*_URL repository variables for this runner OS.'
    }
