name: Setup Rust Validation Environment
description: Configure Rust and shared tooling for Rust validation jobs.

inputs:
  python-version:
    description: Python version passed through to build environment setup.
    required: true
  uv-version:
    description: uv version passed through to build environment setup.
    required: true
  just-version:
    description: just version passed through to build environment setup.
    required: true
  rust-toolchain-version:
    description: Rust toolchain version passed through to build environment setup.
    required: false
    default: "1.85"
  rust-cache-shared-key:
    description: Shared key for Swatinem/rust-cache to avoid cache thrashing between jobs.
    required: false
    default: "rust-workspace"

runs:
  using: composite
  steps:
    - name: Set up build environment
      uses: ./.github/actions/setup-build-env
      with:
        python-version: ${{ inputs.python-version }}
        uv-version: ${{ inputs.uv-version }}
        just-version: ${{ inputs.just-version }}
        rust-toolchain-version: ${{ inputs.rust-toolchain-version }}
        install-uv: "false"
        sync-python-licenses: "false"
        rust-cache-shared-key: ${{ inputs.rust-cache-shared-key }}
