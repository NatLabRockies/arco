name: Setup Build Environment
description: Install Python tooling, Rust toolchain, cache, and sync packaging licenses.

inputs:
  python-version:
    description: Python version for uv-managed commands.
    required: true
  uv-version:
    description: uv version to install.
    required: true
  just-version:
    description: just version to install.
    required: true
  rust-toolchain-version:
    description: Rust toolchain version to install and use.
    required: false
    default: "1.85"
  install-uv:
    description: Whether to install uv and prime its cache.
    required: false
    default: "true"
  sync-python-licenses:
    description: Whether to run Python license synchronization.
    required: false
    default: "true"
  save-uv-cache:
    description: Whether to save uv cache updates.
    required: false
    default: "true"
  save-rust-cache:
    description: Whether to save Rust cache updates.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Restore uv cache
      if: ${{ inputs.install-uv == 'true' }}
      id: uv-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ github.workspace }}/.uv-cache
        key: ${{ runner.os }}-uv-${{ inputs.uv-version }}-py${{ inputs.python-version }}-${{ hashFiles('bindings/python/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ inputs.uv-version }}-py${{ inputs.python-version }}-
          ${{ runner.os }}-uv-${{ inputs.uv-version }}-

    - name: Install uv
      if: ${{ inputs.install-uv == 'true' }}
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
      env:
        UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: false

    - name: Set up Rust
      shell: bash
      env:
        RUST_TOOLCHAIN_VERSION: ${{ inputs.rust-toolchain-version }}
      run: |
        rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
        rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN_VERSION"
        rustup default "$RUST_TOOLCHAIN_VERSION"

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      with:
        shared-key: rust-workspace
        cache-targets: true
        cache-workspace-crates: true
        save-if: ${{ inputs.save-rust-cache == 'true' }}

    - name: Cache just toolcache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.tool_cache }}/just
        key: ${{ runner.os }}-just-${{ inputs.just-version }}

    - name: Install just
      uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
      with:
        just-version: ${{ inputs.just-version }}

    - name: Sync Python license files
      if: ${{ inputs.sync-python-licenses == 'true' && inputs.install-uv == 'true' }}
      env:
        UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      shell: bash
      run: uv run python scripts/sync_python_licenses.py

    - name: Save uv cache
      if: ${{ inputs.install-uv == 'true' && inputs.save-uv-cache == 'true' && steps.uv-cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ github.workspace }}/.uv-cache
        key: ${{ runner.os }}-uv-${{ inputs.uv-version }}-py${{ inputs.python-version }}-${{ hashFiles('bindings/python/uv.lock') }}
