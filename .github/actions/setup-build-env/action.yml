name: Setup Build Environment
description: Install Python tooling, Rust toolchain, cache, and sync packaging licenses.

inputs:
  python-version:
    description: Python version for uv-managed commands.
    required: true
  uv-version:
    description: uv version to install.
    required: true
  just-version:
    description: just version to install.
    required: true
  rust-toolchain-version:
    description: Rust toolchain version to install and use.
    required: false
    default: "1.85"
  install-rust:
    description: Whether to install the Rust toolchain.
    required: false
    default: "true"
  rust-components:
    description: Comma-separated Rust components to install, or "none".
    required: false
    default: "rustfmt,clippy"
  cache-rust:
    description: Whether to restore Rust build artifacts.
    required: false
    default: "true"
  install-uv:
    description: Whether to install uv and prime its cache.
    required: false
    default: "true"
  cache-uv:
    description: Whether to restore and save the uv cache.
    required: false
    default: "true"
  install-just:
    description: Whether to install just.
    required: false
    default: "true"
  configure-solvers:
    description: Whether to configure native solver discovery.
    required: false
    default: "true"
  sync-python-licenses:
    description: Whether to run Python license synchronization.
    required: false
    default: "true"
  save-uv-cache:
    description: Whether to save uv cache updates.
    required: false
    default: "true"
  save-rust-cache:
    description: Whether to save Rust cache updates.
    required: false
    default: "true"
  save-solver-cache:
    description: Whether to save native solver cache updates.
    required: false
    default: "true"
  rust-cache-shared-key:
    description: Shared key for Swatinem/rust-cache to avoid cache thrashing between jobs.
    required: false
    default: "rust-workspace"

runs:
  using: composite
  steps:
    - name: Restore uv cache
      if: ${{ inputs.install-uv == 'true' && inputs.cache-uv == 'true' }}
      id: uv-cache-restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ${{ github.workspace }}/.uv-cache
        key: ${{ runner.os }}-uv-${{ inputs.uv-version }}-py${{
          inputs.python-version }}-${{ hashFiles('bindings/python/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ inputs.uv-version }}-py${{ inputs.python-version }}-
          ${{ runner.os }}-uv-${{ inputs.uv-version }}-

    - name: Install uv
      if: ${{ inputs.install-uv == 'true' }}
      uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
      env:
        UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      with:
        version: ${{ inputs.uv-version }}
        python-version: ${{ inputs.python-version }}
        enable-cache: false

    - name: Set up Rust
      if: ${{ inputs.install-rust == 'true' }}
      shell: bash
      env:
        RUST_TOOLCHAIN_VERSION: ${{ inputs.rust-toolchain-version }}
        RUST_COMPONENTS: ${{ inputs.rust-components }}
      run: bash ./scripts/ci_setup_rust_toolchain.sh

    - name: Restore HiGHS native cache
      if: ${{ inputs.configure-solvers == 'true' }}
      id: highs-cache-restore
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ~/.cache/arco-highs
        key: ${{ runner.os }}-highs-${{ hashFiles('scripts/setup_highs_binary_env.sh') }}
        restore-keys: |
          ${{ runner.os }}-highs-

    - name: Configure HiGHS static binary discovery
      if: ${{ inputs.configure-solvers == 'true' }}
      shell: bash
      run: bash ./scripts/setup_highs_binary_env.sh "$GITHUB_ENV"

    - name: Save HiGHS native cache
      if: ${{ inputs.configure-solvers == 'true' && inputs.save-solver-cache == 'true' && steps.highs-cache-restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ~/.cache/arco-highs
        key: ${{ runner.os }}-highs-${{ hashFiles('scripts/setup_highs_binary_env.sh') }}

    - name: Cache Rust build artifacts
      if: ${{ inputs.cache-rust == 'true' }}
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
      with:
        shared-key: ${{ inputs.rust-cache-shared-key }}
        cache-targets: true
        cache-workspace-crates: true
        save-if: ${{ inputs.save-rust-cache == 'true' }}

    - name: Cache just toolcache
      if: ${{ inputs.install-just == 'true' }}
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ${{ runner.tool_cache }}/just
        key: ${{ runner.os }}-just-${{ inputs.just-version }}

    - name: Install just
      if: ${{ inputs.install-just == 'true' }}
      uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      with:
        just-version: ${{ inputs.just-version }}

    - name: Sync Python license files
      if:
        ${{ inputs.sync-python-licenses == 'true' && inputs.install-uv == 'true'
        }}
      env:
        UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
      shell: bash
      run: uv run python scripts/sync_python_licenses.py

    - name: Save uv cache
      if: ${{ inputs.install-uv == 'true' && inputs.save-uv-cache == 'true' &&
        inputs.cache-uv == 'true' && steps.uv-cache-restore.outputs.cache-hit !=
        'true' }}
      uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
      with:
        path: ${{ github.workspace }}/.uv-cache
        key: ${{ runner.os }}-uv-${{ inputs.uv-version }}-py${{
          inputs.python-version }}-${{ hashFiles('bindings/python/uv.lock') }}
