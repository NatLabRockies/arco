# Based on workflow autogenerated by cargo-dist v0.31.0.
# Modified to integrate with release-please: release-please creates the GitHub
# Release and tag; this workflow builds CLI artifacts and uploads them.
#
# Config: [workspace.metadata.dist] in Cargo.toml
# Protect edits: allow-dirty = ["ci"]

name: release-cli

permissions:
  contents: read

on:
  push:
    tags:
      - "arco-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. arco-v0.3.0) or 'dry-run'"
        required: true
        default: dry-run
        type: string

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Plan: determine what to build
  # ===========================================================================
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      # Derive the dist-compatible tag (v0.2.0) from the release-please tag (arco-v0.2.0)
      tag: ${{ steps.resolve-tag.outputs.tag }}
      tag-flag: ${{ steps.resolve-tag.outputs.tag-flag }}
      release-tag: ${{ steps.resolve-tag.outputs.release-tag }}
      publishing: ${{ steps.resolve-tag.outputs.publishing }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Resolve tag
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail

          # Determine the source tag (from tag push, workflow_dispatch, or PR)
          if [[ "$GITHUB_REF" == refs/tags/arco-v* ]]; then
            # Tag push from release-please
            RELEASE_TAG="$GITHUB_REF_NAME"
            DIST_TAG="v${GITHUB_REF_NAME#arco-v}"
            PUBLISHING="true"
          elif [[ -n "${INPUT_TAG:-}" && "$INPUT_TAG" != "dry-run" ]]; then
            # workflow_dispatch with a real tag
            RELEASE_TAG="$INPUT_TAG"
            DIST_TAG="v${INPUT_TAG#arco-v}"
            PUBLISHING="true"
          else
            # PR or dry-run
            RELEASE_TAG=""
            DIST_TAG=""
            PUBLISHING="false"
          fi

          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "tag-flag=${DIST_TAG:+--tag=$DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "release-tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "publishing=$PUBLISHING" >> "$GITHUB_OUTPUT"

          echo "Dist tag: ${DIST_TAG:-<none>}"
          echo "Release tag: ${RELEASE_TAG:-<none>}"
          echo "Publishing: $PUBLISHING"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Install Rust
        run: rustup update "1.85" --no-self-update && rustup default "1.85"

      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"

      - name: Cache dist
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      # Always use 'dist plan' — release-please owns GitHub Release creation.
      - id: plan
        shell: bash
        env:
          DIST_TAG_FLAG: ${{ steps.resolve-tag.outputs.tag-flag }}
        run: |
          dist plan $DIST_TAG_FLAG --output-format=json > plan-dist-manifest.json
          echo "dist plan ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # ===========================================================================
  # Build per-platform CLI binaries (generated by cargo-dist)
  # ===========================================================================
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') || inputs.tag == 'dry-run' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Use rustup to set correct Rust version
        run: rustup update "1.85" --no-self-update && rustup default "1.85"
      - name: Install dist
        env:
          INSTALL_DIST_CMD: ${{ matrix.install_dist.run }}
        run: $INSTALL_DIST_CMD
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        env:
          PACKAGES_INSTALL_CMD: ${{ matrix.packages_install }}
        run: |
          $PACKAGES_INSTALL_CMD
      - name: Build artifacts
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          # Actually do builds and make zips and whatnot
          dist build $DIST_TAG_FLAG --print=linkage --output-format=json $DIST_ARGS > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ===========================================================================
  # Build global artifacts — installer scripts (generated by cargo-dist)
  # ===========================================================================
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust
        run: rustup update "1.85" --no-self-update && rustup default "1.85"
      - name: Install cached dist
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        env:
          DIST_TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist build $DIST_TAG_FLAG --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ===========================================================================
  # Upload CLI artifacts to the GitHub Release created by release-please
  # ===========================================================================
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          submodules: recursive

      # Collect all built artifacts
      - name: "Download artifacts"
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Cleanup manifests
        run: |
          # Remove the granular manifests — only upload distributable files
          rm -f artifacts/*-dist-manifest.json

      # Upload artifacts to the existing GitHub Release (created by release-please)
      - name: Upload artifacts to GitHub Release
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
        run: |
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

      # Add CLI install instructions to the release notes
      - name: Add CLI install section to release notes
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.release-tag }}
        run: |
          set -euo pipefail

          BODY=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q '.body')

          # Idempotency: skip if already present
          if echo "$BODY" | grep -q '<!-- cli-install -->'; then
            echo "CLI install section already present, skipping."
            exit 0
          fi

          cat > /tmp/cli-section.md <<SECTION
          <!-- cli-install -->
          ## CLI Installation

          Install on macOS/Linux:

          \`\`\`bash
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/arco-cli-installer.sh | sh
          \`\`\`

          Install on Windows (PowerShell):

          \`\`\`powershell
          irm https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/arco-cli-installer.ps1 | iex
          \`\`\`
          SECTION

          # Prepend CLI section to existing release body
          { cat /tmp/cli-section.md; echo; echo "$BODY"; } > /tmp/release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
