name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Required by dorny/paths-filter to read PR file list

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"
  TORC_VERSION: "0.37.2"
  HAWK_VERSION: "0.1.9"

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          install-just: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "false"
          save-solver-cache: "false"

      - name: Validate release version metadata
        run: uv run --no-project --python "$PYTHON_LATEST" python scripts/check_release_version_metadata.py

  ci-plan:
    name: Plan CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      python_compat: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python_compat == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      solver: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.solver == 'true' }}
      kdl: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.kdl == 'true' }}
      benchmarks: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.benchmarks == 'true' }}
      vscode_extension: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.vscode_extension == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'hawk.toml'
              - 'justfile'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/setup_highs_binary_env.sh'
              - 'scripts/setup_scip_binary_env.sh'
              - 'scripts/with_solver_build_env.sh'
              - 'dist-workspace.toml'
              - '.github/actions/**'
            python:
              - 'bindings/python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'scripts/build_python_wheel.sh'
              - 'scripts/test_build_python_wheel.py'
              - 'scripts/setup_manylinux_native_deps.sh'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/setup_highs_binary_env.sh'
              - 'scripts/setup_scip_binary_env.sh'
              - 'scripts/with_solver_build_env.sh'
              - '.github/actions/**'
            python_compat:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/pyproject.toml'
              - 'bindings/python/uv.lock'
              - 'justfile'
              - 'scripts/build_python_wheel.sh'
              - 'scripts/test_build_python_wheel.py'
              - 'scripts/setup_manylinux_native_deps.sh'
              - '.github/actions/**'
              - '.github/workflows/build-packages.yml'
              - '.github/workflows/release-please.yaml'
            docs:
              - 'docs/**'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/test_docs_doctest.py'
              - 'justfile'
              - 'scripts/with_solver_build_env.sh'
            solver:
              - 'scripts/ci_install_apt_deps.sh'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/setup_highs_binary_env.sh'
              - 'scripts/setup_scip_binary_env.sh'
              - 'scripts/with_solver_build_env.sh'
              - 'scripts/setup_solver_runtime_env.sh'
              - 'scripts/smoke_solver.py'
              - 'crates/arco-highs/**'
              - 'crates/arco-scip/**'
              - 'crates/arco-xpress/**'
              - 'crates/arco-ipopt/**'
            kdl:
              - '**/*.kdl'
              - 'crates/arco-kdl/**'
              - 'crates/arco-cli/**'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/test_example_formulations.py'
            benchmarks:
              - 'scripts/ci_add_cargo_bin_to_path.sh'
              - 'scripts/ci_install_torc.sh'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/bench.py'
              - 'scripts/bench_guard.py'
              - 'benchmarks/**'
            vscode_extension:
              - 'scripts/ci_vscode_extension_check.sh'
              - 'tools/vscode-arco-kdl/**'

      - name: Print CI plan
        env:
          RUST: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
          PYTHON: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
          PYTHON_COMPAT: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python_compat == 'true' }}
          DOCS: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
          SOLVER: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.solver == 'true' }}
          KDL: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.kdl == 'true' }}
          BENCHMARKS: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.benchmarks == 'true' }}
          VSCODE_EXTENSION: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.vscode_extension == 'true' }}
        run: bash scripts/ci-plan.sh

  vscode-extension:
    name: VS Code extension
    needs: [ci-plan]
    if: needs.ci-plan.outputs.vscode_extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check and package VS Code extension
        run: bash scripts/ci_vscode_extension_check.sh

  rust-fmt:
    name: Rust format
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "rustfmt"
          cache-rust: "false"
          install-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-fmt
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Check Rust formatting
        run: just ci-rust-fmt

  rust-clippy:
    name: Rust clippy (all-features)
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "clippy"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run clippy (workspace --all-features)
        run: just ci-rust-clippy

  hawk:
    name: Hawk visibility analysis
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          install-just: "false"
          sync-python-licenses: "false"
          cache-rust: "false"
          save-rust-cache: "false"
          save-solver-cache: "false"
          rust-cache-shared-key: hawk

      - name: Install Hawk toolchain
        run: rustup toolchain install 1.97.1

      - name: Install Hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh

      - name: Generate lockfile
        run: cargo +"${RUST_TOOLCHAIN_VERSION}" generate-lockfile

      - name: Run Hawk
        run: cargo +1.97.1 hawk check --target-dir target/hawk -D warnings

  rust-test:
    name: Rust test (all-features)
    needs: [ci-plan, version-consistency, rust-clippy]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run tests (workspace --all-features)
        run: just ci-rust-test

  rust-cross-check:
    name: Rust release compile (${{ matrix.os }})
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-release-compile-${{ matrix.os }}
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Check release CLI compilation
        run: just ci-release-cli-check

  arco-cli-build:
    name: Arco CLI build
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true' || needs.ci-plan.outputs.kdl == 'true' || needs.ci-plan.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build
          save-rust-cache: "false"

      - name: Build CLI (all features)
        run: just ci-cli-build

      - name: Package CLI artifact
        run: just ci-package-cli-artifact

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: arco-cli-linux
          path: artifacts/arco-cli-linux.tar.gz
          retention-days: 1

  solver-smoke:
    name: Solver smoke (${{ matrix.solver }})
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: highs
            setup-runtime: ""
            apt-deps: ""
          - solver: scip
            setup-runtime: ""
            apt-deps: ""
          - solver: xpress
            setup-runtime: "xpress"
            apt-deps: ""
          - solver: ipopt
            setup-runtime: ""
            apt-deps: "liblapack-dev libopenblas-dev gfortran"
            check-unavailable: "--check-unavailable-ipopt"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install apt system dependencies
        if: matrix.apt-deps != ''
        env:
          APT_DEPS: ${{ matrix.apt-deps }}
        run: bash scripts/ci_install_apt_deps.sh

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build
          save-rust-cache: "false"

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Setup solver runtime (${{ matrix.solver }})
        if: matrix.setup-runtime != ''
        env:
          SETUP_RUNTIME: ${{ matrix.setup-runtime }}
        run: bash ./scripts/setup_solver_runtime_env.sh "$SETUP_RUNTIME" "$GITHUB_ENV"

      - name: Run solver smoke
        env:
          SOLVER: ${{ matrix.solver }}
          CHECK_UNAVAILABLE: ${{ matrix.check-unavailable }}
        run: just ci-solver-smoke "$SOLVER" "$CHECK_UNAVAILABLE"

  benchmark:
    name: Benchmarks
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.benchmarks == 'true' || needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Required to post benchmark summaries/comments back to the PR.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore torc binaries
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: torc-cache
        with:
          path: |
            ~/.cargo/bin/torc
            ~/.cargo/bin/torc-server
          key: ${{ runner.os }}-torc-${{ env.TORC_VERSION }}

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          save-rust-cache: "false"
          rust-cache-shared-key: product-build

      - name: Install torc
        run: bash scripts/ci_install_torc.sh

      - name: Save torc binaries
        if: github.ref == 'refs/heads/main' && steps.torc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/bin/torc
            ~/.cargo/bin/torc-server
          key: ${{ runner.os }}-torc-${{ env.TORC_VERSION }}

      - name: Add cargo bin to PATH
        run: bash scripts/ci_add_cargo_bin_to_path.sh

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Run CLI benchmarks
        timeout-minutes: 15
        run: just ci-benchmarks

      - name: Restore previous benchmark data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: benchmark-data-restore
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-main-
            ${{ runner.os }}-benchmark-

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customSmallerIsBetter
          output-file-path: artifacts/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "125%"
          fail-on-alert: false

      - name: Benchmark regression guard
        run: just ci-benchmark-guard

      - name: Save benchmark data
        if: github.ref == 'refs/heads/main' && steps.benchmark-data-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}

  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    needs: [version-consistency, ci-plan]
    if: needs.ci-plan.outputs.python == 'true' || needs.ci-plan.outputs.python_compat == 'true' || needs.ci-plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.ci-plan.outputs.python_compat == 'true' && '["3.10", "3.11", "3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          rust-cache-shared-key: rust-clippy
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "true"

      - name: Run Python quality checks
        run: just ci-python-check

      - name: Run Python tests
        if: matrix.python-version == '3.12'
        run: just ci-python-test

      - name: Build wheel and validate import
        run: just ci-python-wheel "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: just ci-docs-test

  kdl-examples:
    name: KDL examples
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.kdl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"
          save-rust-cache: "false"

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Run KDL acceptance examples
        run: just ci-kdl-examples
