name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.5.0"
  PYTHON_LATEST: "3.12"

jobs:
  workflow-quality:
    name: Workflow quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_LATEST }}

      - name: Run workflow quality checks
        run: uvx zizmor .github

  rust-validation:
    name: Rust validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          install-uv: "false"
          sync-python-licenses: "false"

      - name: Check Rust formatting
        run: just fmt-check

      - name: Run clippy
        run: just clippy

      - name: Run Rust tests
        run: just test

  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      - name: Build wheel
        run: just py-build-ci

      - name: Install built wheel and validate import
        run: just py-smoke-wheel "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: just py-doctest-ci
