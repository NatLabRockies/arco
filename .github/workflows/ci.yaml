name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: &ci-paths
      - "crates/**"
      - "bindings/python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist-workspace.toml"
      - "justfile"
      - "scripts/setup_manylinux_native_deps.sh"
      - "scripts/setup_solver_runtime_env.sh"
      - ".github/build-setup.yml"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/v-release.yml"
      - ".github/workflows/release-please.yaml"
      - ".github/actions/**"
  push:
    branches:
      - main
      - release/*
    paths: *ci-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Required by dorny/paths-filter to read PR file list

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Validate Cargo.toml and pyproject.toml versions match
        run: |
          set -euo pipefail

          cargo_version="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_ws = 1; next }
            /^\[/ && in_ws { in_ws = 0 }
            in_ws && /^version = / { print $2; exit }
          ' Cargo.toml)"

          pyproject_version="$(awk -F '"' '
            /^\[project\]$/ { in_proj = 1; next }
            /^\[/ && in_proj { in_proj = 0 }
            in_proj && /^version = / { print $2; exit }
          ' bindings/python/pyproject.toml)"

          [[ -n "$cargo_version" ]] || { echo "::error::Could not read workspace version from Cargo.toml"; exit 1; }
          [[ -n "$pyproject_version" ]] || { echo "::error::Could not read version from pyproject.toml"; exit 1; }
          [[ "$cargo_version" == "$pyproject_version" ]] || { echo "::error::Version mismatch: Cargo.toml=$cargo_version pyproject.toml=$pyproject_version"; exit 1; }
          echo "Versions match: $cargo_version"

  ci-plan:
    name: Plan CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.filter.outputs.docs || github.event_name == 'workflow_dispatch' }}
      solver: ${{ steps.filter.outputs.solver || github.event_name == 'workflow_dispatch' }}
      kdl: ${{ steps.filter.outputs.kdl || github.event_name == 'workflow_dispatch' }}
      benchmarks: ${{ steps.filter.outputs.benchmarks || github.event_name == 'workflow_dispatch' }}
      release: ${{ steps.filter.outputs.release || github.event_name == 'workflow_dispatch' }}
      github_actions: ${{ steps.filter.outputs.github_actions || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'dist-workspace.toml'
              - '.github/build-setup.yml'
              - '.github/actions/**'
            python:
              - 'bindings/python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - '.github/actions/**'
            docs:
              - 'docs/**'
              - 'scripts/test_docs_doctest.py'
              - 'justfile'
            solver:
              - 'scripts/setup_solver_runtime_env.sh'
            kdl:
              - '**/*.kdl'
            benchmarks:
              - '.github/workflows/benchmarks.yaml'
            release:
              - '.github/release-please-config.json'
              - '.github/release-please-manifest.json'
              - 'dist-workspace.toml'
            github_actions:
              - '.github/workflows/**'
              - '.github/build-setup.yml'
              - '.github/dependabot.yml'

      - name: Print CI plan
        env:
          RUST: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
          PYTHON: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
          DOCS: ${{ steps.filter.outputs.docs || github.event_name == 'workflow_dispatch' }}
          SOLVER: ${{ steps.filter.outputs.solver || github.event_name == 'workflow_dispatch' }}
          KDL: ${{ steps.filter.outputs.kdl || github.event_name == 'workflow_dispatch' }}
          BENCHMARKS: ${{ steps.filter.outputs.benchmarks || github.event_name == 'workflow_dispatch' }}
          RELEASE: ${{ steps.filter.outputs.release || github.event_name == 'workflow_dispatch' }}
          ACTIONS_CONFIG: ${{ steps.filter.outputs.github_actions || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          summary_file="$RUNNER_TEMP/ci-plan-summary.md"
          any_enabled=false
          enabled_buckets=""
          skipped_buckets=""

          {
            echo '## CI Plan'
            echo ''
            echo '| Bucket | Status |'
            echo '|---|---|'
            for bucket in RUST PYTHON DOCS SOLVER KDL BENCHMARKS RELEASE ACTIONS_CONFIG; do
              label="$bucket"
              if [ "$bucket" = "ACTIONS_CONFIG" ]; then
                label="GITHUB_ACTIONS"
              fi
              val="${!bucket:-false}"
              if [ "$val" = "true" ]; then
                echo "| ${label} | :white_check_mark: enabled |"
                any_enabled=true
                enabled_buckets="${enabled_buckets}${label}, "
              else
                echo "| ${label} | :x: skipped |"
                skipped_buckets="${skipped_buckets}${label}, "
              fi
            done
            echo ''
            echo '| Job | Decision | Reason |'
            echo '|---|---|---|'
            if [ "$RELEASE" = "true" ] || [ "$ACTIONS_CONFIG" = "true" ]; then
              echo '| cargo-dist workflow | :white_check_mark: run | release or GitHub Actions inputs changed |'
            else
              echo '| cargo-dist workflow | :x: skip | release and GitHub Actions inputs unchanged |'
            fi
            if [ "$RUST" = "true" ]; then
              echo '| Rust formatting | :white_check_mark: run | Rust bucket enabled |'
              echo '| Rust clippy | :white_check_mark: run | Rust bucket enabled after formatting/version checks |'
              echo '| Rust tests | :white_check_mark: run | Rust bucket enabled after formatting/version checks |'
            else
              echo '| Rust formatting | :x: skip | Rust bucket disabled |'
              echo '| Rust clippy | :x: skip | Rust bucket disabled |'
              echo '| Rust tests | :x: skip | Rust bucket disabled |'
            fi
            if [ "$PYTHON" = "true" ]; then
              echo '| Python validation | :white_check_mark: run | Python bucket enabled |'
            else
              echo '| Python validation | :x: skip | Python bucket disabled |'
            fi
            echo ''
            if [ "$any_enabled" != "true" ]; then
              echo ':warning: No CI buckets were activated - all expensive jobs will skip.'
            fi
          } > "$summary_file"

          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          echo '::group::CI plan'
          cat "$summary_file"
          echo '::endgroup::'

          enabled_buckets="${enabled_buckets%, }"
          skipped_buckets="${skipped_buckets%, }"
          [ -n "$enabled_buckets" ] || enabled_buckets="none"
          [ -n "$skipped_buckets" ] || skipped_buckets="none"
          echo "::notice title=CI plan::enabled=${enabled_buckets}; skipped=${skipped_buckets}"

  cargo-dist:
    name: cargo-dist workflow
    needs: [ci-plan]
    if: needs.ci-plan.outputs.release == 'true' || needs.ci-plan.outputs.github_actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh

      - name: Verify generated workflow is current
        run: |
          set -euo pipefail
          dist generate --mode=ci
          diff -u .github/workflows/release.yml .github/workflows/v-release.yml

      - name: Check dist release plan
        run: dist plan --output-format=json > plan-dist-manifest.json

  rust-fmt:
    name: Rust formatting
    needs: [ci-plan]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --profile minimal
          rustup component add rustfmt --toolchain "$RUST_TOOLCHAIN_VERSION"
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Check Rust formatting
        run: cargo +"$RUST_TOOLCHAIN_VERSION" fmt --all -- --check

  rust-clippy:
    name: Rust clippy (${{ matrix.target.name }})
    needs: [ci-plan, rust-fmt, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: core
            command: just clippy-all
            apt-deps: ""
            fflags: ""
            solver-runtime: ""
          - name: arco-ipopt
            command: just clippy-solver arco-ipopt
            # Build IPOPT from source via ipopt-sys; the Ubuntu 24.04 system
            # package (3.11.9) has a memory corruption bug with MUMPS >= 5.1.0.
            apt-deps: liblapack-dev libopenblas-dev gfortran
            # MUMPS 4.10.0 (bundled by ipopt-sys) has type mismatches that
            # GCC 14 rejects by default (-fallow-argument-mismatch).
            fflags: "-fallow-argument-mismatch"
            solver-runtime: ""
          - name: arco-xpress
            command: just clippy-solver arco-xpress
            apt-deps: ""
            fflags: ""
            solver-runtime: xpress
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.target.apt-deps != ''
        env:
          MATRIX_APT_DEPS: ${{ matrix.target.apt-deps }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          read -r -a apt_deps <<< "$MATRIX_APT_DEPS"
          sudo apt-get install -y --no-install-recommends "${apt_deps[@]}"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: ${{ matrix.target.solver-runtime == 'xpress' && 'true' || 'false' }}
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Set up solver runtime (${{ matrix.target.solver-runtime }})
        if: matrix.target.solver-runtime != ''
        env:
          MATRIX_SOLVER_RUNTIME: ${{ matrix.target.solver-runtime }}
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: |
          set -euo pipefail
          bash ./scripts/setup_solver_runtime_env.sh "$MATRIX_SOLVER_RUNTIME" "$GITHUB_ENV"

      - name: Run clippy (${{ matrix.target.name }})
        env:
          MATRIX_TARGET_NAME: ${{ matrix.target.name }}
          FFLAGS: ${{ matrix.target.fflags }}
          FCFLAGS: ${{ matrix.target.fflags }}
        run: |
          set -euo pipefail
          case "$MATRIX_TARGET_NAME" in
            core) just clippy-all ;;
            arco-ipopt) just clippy-solver arco-ipopt ;;
            arco-xpress) just clippy-solver arco-xpress ;;
            *)
              echo "::error::Unknown clippy target: $MATRIX_TARGET_NAME"
              exit 1
              ;;
          esac

  rust-test:
    name: Rust tests (${{ matrix.target.name }})
    needs: [ci-plan, rust-fmt, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: core
            command: just test
            apt-deps: ""
            fflags: ""
            solver-runtime: ""
          - name: arco-ipopt
            command: just test-solver arco-ipopt
            # Build IPOPT from source via ipopt-sys; the Ubuntu 24.04 system
            # package (3.11.9) has a memory corruption bug with MUMPS >= 5.1.0.
            apt-deps: liblapack-dev libopenblas-dev gfortran
            # MUMPS 4.10.0 (bundled by ipopt-sys) has type mismatches that
            # GCC 14 rejects by default (-fallow-argument-mismatch).
            fflags: "-fallow-argument-mismatch"
            solver-runtime: ""
          - name: arco-xpress
            command: just test-solver arco-xpress
            apt-deps: ""
            fflags: ""
            solver-runtime: xpress
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        if: matrix.target.apt-deps != ''
        env:
          MATRIX_APT_DEPS: ${{ matrix.target.apt-deps }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          read -r -a apt_deps <<< "$MATRIX_APT_DEPS"
          sudo apt-get install -y --no-install-recommends "${apt_deps[@]}"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-rust-cache: "false"

      - name: Set up solver runtime (${{ matrix.target.solver-runtime }})
        if: matrix.target.solver-runtime != ''
        env:
          MATRIX_SOLVER_RUNTIME: ${{ matrix.target.solver-runtime }}
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: |
          set -euo pipefail
          bash ./scripts/setup_solver_runtime_env.sh "$MATRIX_SOLVER_RUNTIME" "$GITHUB_ENV"

      - name: Run tests (${{ matrix.target.name }})
        env:
          MATRIX_TARGET_NAME: ${{ matrix.target.name }}
          FFLAGS: ${{ matrix.target.fflags }}
          FCFLAGS: ${{ matrix.target.fflags }}
        run: |
          set -euo pipefail
          case "$MATRIX_TARGET_NAME" in
            core) just test ;;
            arco-ipopt) just test-solver arco-ipopt ;;
            arco-xpress) just test-solver arco-xpress ;;
            *)
              echo "::error::Unknown test target: $MATRIX_TARGET_NAME"
              exit 1
              ;;
          esac

  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    needs: [version-consistency, ci-plan]
    if: needs.ci-plan.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-cache-shared-key: rust-clippy
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "false"

      - name: Run Python quality checks
        run: just py-check

      - name: Run Python tests
        if: matrix.python-version == '3.12'
        run: just py-test

      - name: Verify pre-commit config
        run: uvx --from pre-commit pre-commit validate-config

      - name: Build wheel and validate import
        run: just py-validate-wheel "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: just docs-test
