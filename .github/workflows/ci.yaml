name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        description: Run the complete source-validation tier for a release candidate
        required: false
        type: boolean
        default: false
      commit:
        description: Exact source commit to validate
        required: false
        type: string
        default: ""

concurrency:
  group: ci-${{ inputs.candidate && 'candidate' || 'source' }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Required by dorny/paths-filter to read PR file list

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"
  TORC_VERSION: "0.37.2"
  HAWK_VERSION: "0.1.9"

jobs:
  version-consistency:
    name: Source preflight
    needs: [ci-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up preflight tools
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: ${{ needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.architecture == 'true' }}
          rust-components: "rustfmt"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          install-just: "true"
          configure-solvers: "false"
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "false"
          save-solver-cache: "false"

      - name: Validate release version metadata
        run: uv run --no-project --python "$PYTHON_LATEST" python scripts/check_release_version_metadata.py

      - name: Check Rust formatting
        if: needs.ci-plan.outputs.rust == 'true'
        run: just ci-rust-fmt

      - name: Check architecture layers
        if: needs.ci-plan.outputs.architecture == 'true'
        run: just ci-arch-check

      - name: Check Python source quality
        if: needs.ci-plan.outputs.python == 'true' || needs.ci-plan.outputs.python_compat == 'true' || needs.ci-plan.outputs.docs == 'true'
        run: just ci-python-check

  ci-plan:
    name: Plan CI jobs
    if: >-
      inputs.candidate ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'github-actions[bot]' ||
      !startsWith(github.event.pull_request.head.ref, 'release-please--branches--')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.rust == 'true' }}
      python: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.python == 'true' }}
      python_compat: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.python_compat == 'true' }}
      docs: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.docs == 'true' }}
      solver: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.solver == 'true' }}
      kdl: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.kdl == 'true' || steps.filter.outputs.rust == 'true' }}
      benchmarks: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.benchmarks == 'true' }}
      architecture: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.architecture == 'true' }}
      vscode_extension: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.vscode_extension == 'true' }}
      automation: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.automation == 'true' }}
      grammar: ${{ inputs.candidate || github.event_name == 'workflow_dispatch' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.grammar == 'true' }}
    steps:
      - if: github.event_name == 'push'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
          fetch-depth: 2

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: ${{ !inputs.candidate && github.event_name != 'workflow_dispatch' }}
        with:
          base: ${{ github.ref }}
          filters: |
            shared:
              - '.github/workflows/ci.yaml'
              - '.github/actions/**'
              - 'justfile'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/setup_*'
              - 'scripts/with_solver_build_env.sh'
              - 'scripts/ci_install_apt_deps.sh'
              - 'scripts/ci_install_macos_scip_runtime.sh'
              - 'scripts/ci_install_rust_if_missing.sh'
              - 'rust-toolchain.toml'
            rust:
              - 'bindings/python/src/**/*.rs'
              - 'bindings/python/Cargo.toml'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'hawk.toml'
              - 'clippy.toml'
              - 'dist-workspace.toml'
            python:
              - 'scripts/python_package_smoke.py'
              - 'scripts/validate_python_sdist.py'
              - 'scripts/sync_python_licenses.py'
              - 'licenses/**'
              - 'crates/**'
              - 'bindings/python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'scripts/build_python_wheel.sh'
              - 'scripts/test_build_python_wheel.py'
            python_compat:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/pyproject.toml'
              - 'bindings/python/uv.lock'
              - 'scripts/build_python_wheel.sh'
              - 'scripts/test_build_python_wheel.py'
              - '.github/workflows/build-packages.yml'
            docs:
              - 'docs/**'
              - 'scripts/test_docs_doctest.py'
            solver:
              - 'scripts/smoke_solver.py'
              - 'crates/arco-highs/**'
              - 'crates/arco-scip/**'
              - 'crates/arco-xpress/**'
              - 'crates/arco-ipopt/**'
            kdl:
              - '**/*.kdl'
              - 'examples/**'
              - 'crates/**'
              - 'scripts/test_example_formulations.py'
            benchmarks:
              - 'scripts/ci_add_cargo_bin_to_path.sh'
              - 'scripts/ci_install_torc.sh'
              - 'scripts/bench.py'
              - 'scripts/bench_guard.py'
              - 'benchmarks/**'
            architecture:
              - 'bindings/python/Cargo.toml'
              - 'architecture-layers.toml'
              - 'Cargo.toml'
              - 'crates/**/Cargo.toml'
              - 'scripts/check_architecture.py'
            vscode_extension:
              - 'scripts/ci_vscode_extension_check.sh'
              - 'tools/vscode-arco-kdl/**'
            automation:
              - '.github/**'
              - 'scripts/**'
              - 'dist-workspace.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/pyproject.toml'
              - '.pre-commit-config.yaml'
              - 'bindings/python/tests/test_rust_boundaries.py'
            grammar:
              - '**/*.kdl'
              - '.pre-commit-config.yaml'
              - 'scripts/check-kdl-overlay.sh'
              - 'tools/tree-sitter-arco-kdl/**'
              - 'tools/vscode-arco-kdl/**'
              - '.github/workflows/kdl-overlay.yaml'

  vscode-extension:
    name: VS Code extension
    needs: [ci-plan, version-consistency]
    if: ${{ !inputs.candidate && needs.ci-plan.outputs.vscode_extension == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check and package VS Code extension
        run: bash scripts/ci_vscode_extension_check.sh

  rust-clippy:
    name: Rust clippy (all-features)
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "clippy"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run clippy (workspace --all-features)
        run: just ci-rust-clippy

  hawk:
    name: Hawk visibility analysis
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          install-just: "false"
          sync-python-licenses: "false"
          cache-rust: "false"
          save-rust-cache: "false"
          save-solver-cache: "false"
          rust-cache-shared-key: hawk

      - name: Install Hawk toolchain
        run: rustup toolchain install 1.97.1

      - name: Install Hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh

      - name: Generate lockfile
        run: cargo +"${RUST_TOOLCHAIN_VERSION}" generate-lockfile

      - name: Run Hawk
        run: cargo +1.97.1 hawk check --target-dir target/hawk -D warnings

  rust-test:
    name: Rust test (all-features)
    needs: [ci-plan, version-consistency, rust-clippy]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run tests (workspace --all-features)
        run: just ci-rust-test

  rust-cross-check:
    name: Rust release compile (${{ matrix.os }})
    needs: [ci-plan, version-consistency]
    if: ${{ !inputs.candidate && (needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-release-compile-${{ matrix.os }}
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Check release CLI compilation
        run: just ci-release-cli-check

  arco-cli-build:
    name: Arco CLI build
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true' || needs.ci-plan.outputs.kdl == 'true' || needs.ci-plan.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build
          save-rust-cache: "false"

      - name: Build CLI (all features)
        run: just ci-cli-build

      - name: Package CLI artifact
        run: just ci-package-cli-artifact

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: arco-cli-linux
          path: artifacts/arco-cli-linux.tar.gz
          retention-days: 1

  solver-smoke:
    name: Solver smoke (${{ matrix.solver }})
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: highs
            setup-runtime: ""
            apt-deps: ""
          - solver: scip
            setup-runtime: ""
            apt-deps: ""
          - solver: xpress
            setup-runtime: "xpress"
            apt-deps: ""
          - solver: ipopt
            setup-runtime: ""
            apt-deps: "liblapack-dev libopenblas-dev gfortran"
            check-unavailable: "--check-unavailable-ipopt"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Install apt system dependencies
        if: matrix.apt-deps != ''
        env:
          APT_DEPS: ${{ matrix.apt-deps }}
        run: bash scripts/ci_install_apt_deps.sh

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build
          save-rust-cache: "false"

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Setup solver runtime (${{ matrix.solver }})
        if: matrix.setup-runtime != ''
        env:
          SETUP_RUNTIME: ${{ matrix.setup-runtime }}
        run: bash ./scripts/setup_solver_runtime_env.sh "$SETUP_RUNTIME" "$GITHUB_ENV"

      - name: Run solver smoke
        env:
          SOLVER: ${{ matrix.solver }}
          CHECK_UNAVAILABLE: ${{ matrix.check-unavailable }}
        run: just ci-solver-smoke "$SOLVER" "$CHECK_UNAVAILABLE"

  benchmark:
    name: Benchmarks
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.benchmarks == 'true' || needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Restore torc binaries
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: torc-cache
        with:
          path: |
            ~/.cargo/bin/torc
            ~/.cargo/bin/torc-server
          key: ${{ runner.os }}-torc-${{ env.TORC_VERSION }}

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          save-rust-cache: "false"
          rust-cache-shared-key: product-build

      - name: Install torc
        run: bash scripts/ci_install_torc.sh

      - name: Save torc binaries
        if: github.ref == 'refs/heads/main' && steps.torc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/bin/torc
            ~/.cargo/bin/torc-server
          key: ${{ runner.os }}-torc-${{ env.TORC_VERSION }}

      - name: Add cargo bin to PATH
        run: bash scripts/ci_add_cargo_bin_to_path.sh

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Run CLI benchmarks
        timeout-minutes: 15
        run: just ci-benchmarks

      - name: Restore previous benchmark data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: benchmark-data-restore
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-main-
            ${{ runner.os }}-benchmark-

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customSmallerIsBetter
          output-file-path: artifacts/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          summary-always: true
          comment-on-alert: false
          alert-threshold: "125%"
          fail-on-alert: false

      - name: Benchmark regression guard
        run: just ci-benchmark-guard

      - name: Save benchmark data
        if: github.ref == 'refs/heads/main' && steps.benchmark-data-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}

  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    needs: [version-consistency, ci-plan]
    if: needs.ci-plan.outputs.python == 'true' || needs.ci-plan.outputs.python_compat == 'true' || needs.ci-plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(!inputs.candidate && needs.ci-plan.outputs.python_compat == 'true' && '["3.10", "3.11", "3.12", "3.13", "3.14"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          rust-cache-shared-key: rust-clippy
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "true"

      - name: Run Python tests
        if: matrix.python-version == '3.12'
        run: just ci-python-test

      - name: Build wheel and validate import
        if: ${{ !inputs.candidate }}
        run: just ci-python-wheel "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: just ci-docs-test

  kdl-examples:
    name: KDL examples
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.kdl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"
          save-rust-cache: "false"

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Run KDL acceptance examples
        run: just ci-kdl-examples

  workflow-quality:
    name: Workflow quality
    needs: ci-plan
    if: needs.ci-plan.outputs.automation == 'true'
    uses: $/.github/workflows/workflow-quality.yaml
    with:
      commit: ${{ inputs.commit || github.sha }}
    permissions:
      contents: read

  kdl-overlay:
    name: KDL overlay
    needs: ci-plan
    if: needs.ci-plan.outputs.grammar == 'true'
    uses: $/.github/workflows/kdl-overlay.yaml
    with:
      commit: ${{ inputs.commit || github.sha }}
    permissions:
      contents: read

  ci-result:
    name: CI result
    if: ${{ always() }}
    needs:
      - ci-plan
      - version-consistency
      - vscode-extension
      - rust-clippy
      - hawk
      - rust-test
      - rust-cross-check
      - arco-cli-build
      - solver-smoke
      - benchmark
      - python-validation
      - kdl-examples
      - workflow-quality
      - kdl-overlay
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
