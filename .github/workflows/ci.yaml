name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"

jobs:
  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Build wheel
        run:
          uv run --with build python -m build bindings/python --wheel --outdir
          dist

      - name: Install built wheel and validate import
        run: uv run python scripts/python_package_smoke.py --artifact-glob
          "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: uv run --project bindings/python --with pytest --with numpy pytest
          scripts/test_docs_doctest.py -v
