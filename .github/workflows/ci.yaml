name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Required by dorny/paths-filter to read PR file list

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"
  TORC_VERSION: "0.37.2"
  CARGO_DIST_VERSION: "0.31.0"
  HAWK_VERSION: "0.1.9"

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          install-just: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "false"
          save-solver-cache: "false"

      - name: Validate release version metadata
        run: uv run --no-project --python "$PYTHON_LATEST" python scripts/check_release_version_metadata.py

  ci-plan:
    name: Plan CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
      python: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      solver: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.solver == 'true' }}
      kdl: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.kdl == 'true' }}
      benchmarks: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.benchmarks == 'true' }}
      release: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.release == 'true' }}
      github_actions: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.github_actions == 'true' }}
      vscode_extension: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.vscode_extension == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'hawk.toml'
              - 'justfile'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/setup_highs_binary_env.sh'
              - 'scripts/setup_scip_binary_env.sh'
              - 'scripts/with_solver_build_env.sh'
              - 'dist-workspace.toml'
              - '.github/build-setup.yml'
              - '.github/actions/**'
            python:
              - 'bindings/python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/setup_highs_binary_env.sh'
              - 'scripts/setup_scip_binary_env.sh'
              - 'scripts/with_solver_build_env.sh'
              - '.github/actions/**'
            docs:
              - 'docs/**'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/test_docs_doctest.py'
              - 'justfile'
              - 'scripts/with_solver_build_env.sh'
            solver:
              - 'scripts/ci_install_apt_deps.sh'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/setup_highs_binary_env.sh'
              - 'scripts/setup_scip_binary_env.sh'
              - 'scripts/with_solver_build_env.sh'
              - 'scripts/setup_solver_runtime_env.sh'
              - 'scripts/smoke_solver.py'
              - 'crates/arco-highs/**'
              - 'crates/arco-scip/**'
              - 'crates/arco-xpress/**'
              - 'crates/arco-ipopt/**'
            kdl:
              - '**/*.kdl'
              - 'crates/arco-kdl/**'
              - 'crates/arco-cli/**'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/test_example_formulations.py'
            benchmarks:
              - 'scripts/ci_add_cargo_bin_to_path.sh'
              - 'scripts/ci_install_torc.sh'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/bench.py'
              - 'scripts/bench_guard.py'
              - 'benchmarks/**'
            release:
              - 'Cargo.toml'
              - 'bindings/python/pyproject.toml'
              - 'bindings/python/uv.lock'
              - 'CHANGELOG.md'
              - 'scripts/check_release_version_metadata.py'
              - 'scripts/ci_cargo_dist_preflight.sh'
              - 'scripts/ci_dist_plan_output.sh'
              - 'scripts/ci_ensure_dist_executable.sh'
              - 'scripts/ci_install_dist_unix.sh'
              - 'scripts/ci_install_dist_windows.ps1'
              - 'scripts/ci_install_rust_if_missing.sh'
              - 'scripts/ci_setup_rust_toolchain.sh'
              - 'scripts/ci_validate_xpress_runtime_env.sh'
              - 'scripts/ci_verify_generated_dist_workflow.sh'
              - '.github/release-please-config.json'
              - '.github/release-please-manifest.json'
              - 'dist-workspace.toml'
            github_actions:
              - '.github/workflows/**'
              - '.github/build-setup.yml'
              - '.github/dependabot.yml'
              - 'scripts/check_release_version_metadata.py'
              - 'scripts/ci_*.ps1'
              - 'scripts/ci_*.sh'
            vscode_extension:
              - 'scripts/ci_vscode_extension_check.sh'
              - 'tools/vscode-arco-kdl/**'

      - name: Print CI plan
        env:
          RUST: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
          PYTHON: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.python == 'true' }}
          DOCS: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
          SOLVER: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.solver == 'true' }}
          KDL: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.kdl == 'true' }}
          BENCHMARKS: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.benchmarks == 'true' }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.release == 'true' }}
          ACTIONS_CONFIG: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.github_actions == 'true' }}
          VSCODE_EXTENSION: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.vscode_extension == 'true' }}
        run: bash scripts/ci-plan.sh

  vscode-extension:
    name: VS Code extension
    needs: [ci-plan]
    if: needs.ci-plan.outputs.vscode_extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Check and package VS Code extension
        run: bash scripts/ci_vscode_extension_check.sh

  cargo-dist:
    name: cargo-dist workflow
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.release == 'true' || needs.ci-plan.outputs.github_actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifacts_matrix: ${{ steps.plan.outputs.artifacts_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore dist cache
        id: dist-cache-restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/bin/dist
            ~/.cargo/bin/dist.exe
          key: ${{ runner.os }}-${{ runner.arch }}-dist-${{ env.CARGO_DIST_VERSION }}

      - name: Install dist
        if: steps.dist-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/ci_install_dist_unix.sh

      - name: Save dist cache
        if: github.event_name != 'pull_request' && steps.dist-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/bin/dist
            ~/.cargo/bin/dist.exe
          key: ${{ runner.os }}-${{ runner.arch }}-dist-${{ env.CARGO_DIST_VERSION }}

      - name: Ensure dist is executable
        if: runner.os != 'Windows'
        run: bash scripts/ci_ensure_dist_executable.sh

      - name: Verify generated workflow is current
        run: bash scripts/ci_verify_generated_dist_workflow.sh

      - id: plan
        name: Check dist release plan
        run: bash scripts/ci_dist_plan_output.sh

  cargo-dist-artifact-preflight:
    name: cargo-dist preflight (${{ join(matrix.targets, ', ') }})
    needs: [ci-plan, version-consistency, cargo-dist]
    if: needs.cargo-dist.result == 'success' && needs.cargo-dist.outputs.artifacts_matrix != '' && needs.cargo-dist.outputs.artifacts_matrix != 'null'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && 'quay.io/pypa/manylinux_2_28_x86_64@sha256:65140ef21cef92d0c13d001708afd7d304d7a154f7120d039df99dac708f3ffb' || null }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cargo-dist.outputs.artifacts_matrix) }}
    steps:
      - name: Enable Windows long paths
        run: git config --global core.longpaths true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust in container
        if: matrix.container
        shell: bash
        run: bash scripts/ci_install_rust_if_missing.sh

      - name: Configure manylinux native dependency builds
        if: matrix.container && contains(join(matrix.targets, ','), 'x86_64-unknown-linux-gnu')
        shell: bash
        run: bash ./scripts/setup_manylinux_native_deps.sh "$GITHUB_ENV"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        env:
          ARCO_HIGHS_ENABLE_APPLE_STATIC: "1"
          ARCO_HIGHS_TARGETS: ${{ join(matrix.targets, ',') }}
          ARCO_SCIP_TARGETS: ${{ join(matrix.targets, ',') }}
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-just: "false"
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: cargo-dist-${{ matrix.host }}
          save-rust-cache: "false"
          save-uv-cache: "false"
          save-solver-cache: "false"

      - name: Set up Xpress runtime
        shell: bash
        env:
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: bash ./scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"

      - name: Validate XPRESSDIR for xpress-enabled dist builds
        shell: bash
        run: bash scripts/ci_validate_xpress_runtime_env.sh

      - name: Restore dist cache
        id: dist-cache-restore
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: |
            ~/.cargo/bin/dist
            ~/.cargo/bin/dist.exe
          key: ${{ runner.os }}-${{ runner.arch }}-dist-${{ env.CARGO_DIST_VERSION }}

      - name: Install dist (Unix)
        if: runner.os != 'Windows' && steps.dist-cache-restore.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/ci_install_dist_unix.sh

      - name: Install dist (Windows)
        if: runner.os == 'Windows' && steps.dist-cache-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/ci_install_dist_windows.ps1

      - name: Save dist cache
        if: github.event_name != 'pull_request' && steps.dist-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/bin/dist
            ~/.cargo/bin/dist.exe
          key: ${{ runner.os }}-${{ runner.arch }}-dist-${{ env.CARGO_DIST_VERSION }}

      - name: Ensure dist is executable
        if: runner.os != 'Windows'
        run: bash scripts/ci_ensure_dist_executable.sh

      - name: Build local cargo-dist artifacts
        shell: bash
        env:
          DIST_CONTAINER_IMAGE: ${{ matrix.container && matrix.container.image || '' }}
          DIST_PLAN_ARGS: ${{ matrix.dist_args }}
          DIST_TARGETS: ${{ join(matrix.targets, ',') }}
        run: bash scripts/ci_cargo_dist_preflight.sh

  rust-fmt:
    name: Rust format
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "rustfmt"
          cache-rust: "false"
          install-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-fmt
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Check Rust formatting
        run: just ci-rust-fmt

  rust-clippy:
    name: Rust clippy (all-features)
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "clippy"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run clippy (workspace --all-features)
        run: just ci-rust-clippy

  hawk:
    name: Hawk visibility analysis
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          install-just: "false"
          sync-python-licenses: "false"
          cache-rust: "false"
          save-rust-cache: "false"
          save-solver-cache: "false"
          rust-cache-shared-key: hawk

      - name: Install Hawk toolchain
        run: rustup toolchain install 1.97.1

      - name: Install Hawk
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/astral-sh/hawk/releases/download/${HAWK_VERSION}/cargo-hawk-installer.sh" | sh

      - name: Generate lockfile
        run: cargo +"${RUST_TOOLCHAIN_VERSION}" generate-lockfile

      - name: Run Hawk
        run: cargo +1.97.1 hawk check --target-dir target/hawk -D warnings

  rust-test:
    name: Rust test (all-features)
    needs: [ci-plan, version-consistency, rust-clippy]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run tests (workspace --all-features)
        run: just ci-rust-test

  rust-cross-check:
    name: Rust release compile (${{ matrix.os }})
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-release-compile-${{ matrix.os }}
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Check release CLI compilation
        run: just ci-release-cli-check

  arco-cli-build:
    name: Arco CLI build
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true' || needs.ci-plan.outputs.kdl == 'true' || needs.ci-plan.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build
          save-rust-cache: "false"

      - name: Build CLI (all features)
        run: just ci-cli-build

      - name: Package CLI artifact
        run: just ci-package-cli-artifact

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: arco-cli-linux
          path: artifacts/arco-cli-linux.tar.gz
          retention-days: 1

  solver-smoke:
    name: Solver smoke (${{ matrix.solver }})
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: highs
            setup-runtime: ""
            apt-deps: ""
          - solver: scip
            setup-runtime: ""
            apt-deps: ""
          - solver: xpress
            setup-runtime: "xpress"
            apt-deps: ""
          - solver: ipopt
            setup-runtime: ""
            apt-deps: "liblapack-dev libopenblas-dev gfortran"
            check-unavailable: "--check-unavailable-ipopt"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install apt system dependencies
        if: matrix.apt-deps != ''
        env:
          APT_DEPS: ${{ matrix.apt-deps }}
        run: bash scripts/ci_install_apt_deps.sh

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build
          save-rust-cache: "false"

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Setup solver runtime (${{ matrix.solver }})
        if: matrix.setup-runtime != ''
        env:
          SETUP_RUNTIME: ${{ matrix.setup-runtime }}
        run: bash ./scripts/setup_solver_runtime_env.sh "$SETUP_RUNTIME" "$GITHUB_ENV"

      - name: Run solver smoke
        env:
          SOLVER: ${{ matrix.solver }}
          CHECK_UNAVAILABLE: ${{ matrix.check-unavailable }}
        run: just ci-solver-smoke "$SOLVER" "$CHECK_UNAVAILABLE"

  benchmark:
    name: Benchmarks
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.benchmarks == 'true' || needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Required to post benchmark summaries/comments back to the PR.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Restore torc binaries
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: torc-cache
        with:
          path: |
            ~/.cargo/bin/torc
            ~/.cargo/bin/torc-server
          key: ${{ runner.os }}-torc-${{ env.TORC_VERSION }}

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          save-rust-cache: "false"
          rust-cache-shared-key: product-build

      - name: Install torc
        run: bash scripts/ci_install_torc.sh

      - name: Save torc binaries
        if: github.ref == 'refs/heads/main' && steps.torc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/bin/torc
            ~/.cargo/bin/torc-server
          key: ${{ runner.os }}-torc-${{ env.TORC_VERSION }}

      - name: Add cargo bin to PATH
        run: bash scripts/ci_add_cargo_bin_to_path.sh

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Run CLI benchmarks
        timeout-minutes: 15
        run: just ci-benchmarks

      - name: Restore previous benchmark data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: benchmark-data-restore
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-main-
            ${{ runner.os }}-benchmark-

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customSmallerIsBetter
          output-file-path: artifacts/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "125%"
          fail-on-alert: false

      - name: Benchmark regression guard
        run: just ci-benchmark-guard

      - name: Save benchmark data
        if: github.ref == 'refs/heads/main' && steps.benchmark-data-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}

  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    needs: [version-consistency, ci-plan]
    if: needs.ci-plan.outputs.python == 'true' || needs.ci-plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && needs.ci-plan.outputs.release != 'true' && '["3.12"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          rust-cache-shared-key: rust-clippy
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "true"

      - name: Run Python quality checks
        run: just ci-python-check

      - name: Run Python tests
        if: matrix.python-version == '3.12'
        run: just ci-python-test

      - name: Build wheel and validate import
        run: just ci-python-wheel "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: just ci-docs-test

  python-release-preflight:
    name: Python release preflight (${{ matrix.platform.label }}, ${{ matrix.python.label }})
    needs: [version-consistency, ci-plan]
    if: needs.ci-plan.outputs.release == 'true' || needs.ci-plan.outputs.github_actions == 'true'
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python:
          - label: cp310
            version: "3.10"
            wheel_features: "pyo3/extension-module,xpress,scip-from-source"
          - label: abi3
            version: "3.11"
            wheel_features: "pyo3/extension-module,pyo3/abi3-py311,xpress,scip-from-source"
        platform:
          - label: linux
            os: ubuntu-latest
            wheel_python: python3
          - label: macos-arm64
            os: macos-14
            wheel_python: python3
          - label: windows
            os: windows-latest
            wheel_python: python
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        env:
          ARCO_HIGHS_ENABLE_APPLE_STATIC: "1"
        with:
          python-version: ${{ matrix.python.version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          rust-cache-shared-key: python-release-${{ matrix.platform.label }}-${{ matrix.python.label }}
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "false"

      - name: Build wheel and validate import
        env:
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.platform.wheel_python }}
          PYTHON_WHEEL_FEATURES: ${{ matrix.python.wheel_features }}
        run: just ci-python-release-wheel "dist/*.whl"

      - name: Build sdist
        if: matrix.platform.label == 'linux' && matrix.python.label == 'abi3'
        run: just py-build-sdist

  kdl-examples:
    name: KDL examples
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.kdl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-rust: "false"
          rust-components: "none"
          cache-rust: "false"
          install-uv: "true"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"
          save-rust-cache: "false"

      - name: Download CLI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5
        with:
          name: arco-cli-linux
          path: artifacts

      - name: Extract CLI artifact
        run: just ci-unpack-cli-artifact

      - name: Run KDL acceptance examples
        run: just ci-kdl-examples
