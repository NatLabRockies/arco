name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.5.0"
  PYTHON_LATEST: "3.12"

jobs:
  workflow-quality:
    name: Workflow quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_LATEST }}

      - name: Run workflow quality checks
        run: uvx zizmor .github

  rust-clippy-core:
    name: Rust clippy (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-rust-validation-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      - name: Run clippy (core)
        run: just clippy-core

  rust-clippy-solvers:
    name: Rust clippy (${{ matrix.solver.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solver:
          - package: arco-ipopt
            apt-deps: coinor-libipopt-dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install solver system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ${{ matrix.solver.apt-deps }}

      - name: Set up build environment
        uses: ./.github/actions/setup-rust-validation-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      - name: Run clippy (${{ matrix.solver.package }})
        run: just clippy-solver ${{ matrix.solver.package }}

  rust-test-core:
    name: Rust tests (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-rust-validation-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      - name: Run Rust tests (core)
        run: just test-core

  rust-test-solvers:
    name: Rust tests (${{ matrix.solver.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solver:
          - package: arco-ipopt
            apt-deps: coinor-libipopt-dev
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install solver system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ${{ matrix.solver.apt-deps }}

      - name: Set up build environment
        uses: ./.github/actions/setup-rust-validation-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      - name: Run Rust tests (${{ matrix.solver.package }})
        run: just test-solver ${{ matrix.solver.package }}

  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    needs: [rust-test-core]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          save-uv-cache: "false"
          save-rust-cache: "false"

      - name: Build wheel
        run: just py-build-ci

      - name: Install built wheel and validate import
        run: just py-smoke-wheel "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: just py-doctest-ci
