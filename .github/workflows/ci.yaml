name: Continuous Integration

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: &ci-paths
      - "crates/**"
      - "bindings/python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dist-workspace.toml"
      - "justfile"
      - "scripts/setup_manylinux_native_deps.sh"
      - "scripts/setup_solver_runtime_env.sh"
      - "scripts/smoke_solver.py"
      - "scripts/test_docs_doctest.py"
      - "docs/**"
      - ".github/build-setup.yml"
      - ".github/workflows/ci.yaml"
      - ".github/workflows/v-release.yml"
      - ".github/workflows/release-please.yaml"
      - ".github/actions/**"
  push:
    branches:
      - main
      - release/*
    paths: *ci-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Required by dorny/paths-filter to read PR file list

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Validate Cargo.toml and pyproject.toml versions match
        run: |
          set -euo pipefail

          cargo_version="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_ws = 1; next }
            /^\[/ && in_ws { in_ws = 0 }
            in_ws && /^version = / { print $2; exit }
          ' Cargo.toml)"

          pyproject_version="$(awk -F '"' '
            /^\[project\]$/ { in_proj = 1; next }
            /^\[/ && in_proj { in_proj = 0 }
            in_proj && /^version = / { print $2; exit }
          ' bindings/python/pyproject.toml)"

          [[ -n "$cargo_version" ]] || { echo "::error::Could not read workspace version from Cargo.toml"; exit 1; }
          [[ -n "$pyproject_version" ]] || { echo "::error::Could not read version from pyproject.toml"; exit 1; }
          [[ "$cargo_version" == "$pyproject_version" ]] || { echo "::error::Version mismatch: Cargo.toml=$cargo_version pyproject.toml=$pyproject_version"; exit 1; }
          echo "Versions match: $cargo_version"

  ci-plan:
    name: Plan CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      rust: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.filter.outputs.docs || github.event_name == 'workflow_dispatch' }}
      solver: ${{ steps.filter.outputs.solver || github.event_name == 'workflow_dispatch' }}
      kdl: ${{ steps.filter.outputs.kdl || github.event_name == 'workflow_dispatch' }}
      benchmarks: ${{ steps.filter.outputs.benchmarks || github.event_name == 'workflow_dispatch' }}
      release: ${{ steps.filter.outputs.release || github.event_name == 'workflow_dispatch' }}
      github_actions: ${{ steps.filter.outputs.github_actions || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - 'dist-workspace.toml'
              - '.github/build-setup.yml'
              - '.github/actions/**'
            python:
              - 'bindings/python/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'justfile'
              - '.github/actions/**'
            docs:
              - 'docs/**'
              - 'scripts/test_docs_doctest.py'
              - 'justfile'
            solver:
              - 'scripts/setup_solver_runtime_env.sh'
              - 'scripts/smoke_solver.py'
              - 'crates/arco-highs/**'
              - 'crates/arco-scip/**'
              - 'crates/arco-xpress/**'
              - 'crates/arco-ipopt/**'
            kdl:
              - '**/*.kdl'
              - 'scripts/test_example_formulations.py'
            benchmarks:
              - 'scripts/bench.py'
              - 'scripts/bench_guard.py'
              - 'benchmarks/**'
            release:
              - '.github/release-please-config.json'
              - '.github/release-please-manifest.json'
              - 'dist-workspace.toml'
            github_actions:
              - '.github/workflows/**'
              - '.github/build-setup.yml'
              - '.github/dependabot.yml'

      - name: Print CI plan
        env:
          RUST: ${{ steps.filter.outputs.rust || github.event_name == 'workflow_dispatch' }}
          PYTHON: ${{ steps.filter.outputs.python || github.event_name == 'workflow_dispatch' }}
          DOCS: ${{ steps.filter.outputs.docs || github.event_name == 'workflow_dispatch' }}
          SOLVER: ${{ steps.filter.outputs.solver || github.event_name == 'workflow_dispatch' }}
          KDL: ${{ steps.filter.outputs.kdl || github.event_name == 'workflow_dispatch' }}
          BENCHMARKS: ${{ steps.filter.outputs.benchmarks || github.event_name == 'workflow_dispatch' }}
          RELEASE: ${{ steps.filter.outputs.release || github.event_name == 'workflow_dispatch' }}
          ACTIONS_CONFIG: ${{ steps.filter.outputs.github_actions || github.event_name == 'workflow_dispatch' }}
        run: bash scripts/ci-plan.sh

  cargo-dist:
    name: cargo-dist workflow
    needs: [ci-plan]
    if: needs.ci-plan.outputs.release == 'true' || needs.ci-plan.outputs.github_actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh

      - name: Verify generated workflow is current
        run: |
          set -euo pipefail
          dist generate --mode=ci
          diff -u .github/workflows/release.yml .github/workflows/v-release.yml

      - name: Check dist release plan
        run: dist plan --output-format=json > plan-dist-manifest.json

  rust-fmt:
    name: Rust format
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN_VERSION" --component rustfmt --no-self-update
          rustup default "$RUST_TOOLCHAIN_VERSION"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  rust-clippy:
    name: Rust clippy (all-features)
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run clippy (workspace --all-features)
        run: just rust-clippy-all-features

  rust-test:
    name: Rust test (all-features)
    needs: [ci-plan, version-consistency, rust-clippy]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"

      - name: Run tests (workspace --all-features)
        run: just rust-test-all-features

  arco-cli-build:
    name: Arco CLI build
    needs: [ci-plan, version-consistency]
    if: needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "false"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build
          save-rust-cache: "true"

      - name: Build CLI (all features)
        run: just cli-build-all-features

  solver-smoke:
    name: Solver smoke (${{ matrix.solver }})
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.rust == 'true' || needs.ci-plan.outputs.solver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: highs
            setup-runtime: ""
            apt-deps: ""
          - solver: scip
            setup-runtime: ""
            apt-deps: ""
          - solver: xpress
            setup-runtime: "xpress"
            apt-deps: ""
          - solver: ipopt
            setup-runtime: ""
            apt-deps: "liblapack-dev libopenblas-dev gfortran"
            check-unavailable: "--check-unavailable-ipopt"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install apt system dependencies
        if: matrix.apt-deps != ''
        env:
          APT_DEPS: ${{ matrix.apt-deps }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$APT_DEPS"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: product-build

      - name: Setup solver runtime (${{ matrix.solver }})
        if: matrix.setup-runtime != ''
        env:
          SETUP_RUNTIME: ${{ matrix.setup-runtime }}
        run: |
          set -euo pipefail
          bash ./scripts/setup_solver_runtime_env.sh "$SETUP_RUNTIME" "$GITHUB_ENV"

      - name: Run solver smoke
        env:
          SOLVER: ${{ matrix.solver }}
          CHECK_UNAVAILABLE: ${{ matrix.check-unavailable }}
        run: |
          args=(--solver "$SOLVER" --arco-binary target/release/arco)
          if [[ -n "$CHECK_UNAVAILABLE" ]]; then args+=($CHECK_UNAVAILABLE); fi
          uv run python scripts/smoke_solver.py "${args[@]}"

  benchmark:
    name: Benchmarks
    needs: [ci-plan, arco-cli-build]
    if: needs.ci-plan.outputs.benchmarks == 'true' || needs.ci-plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Required to post benchmark summaries/comments back to the PR.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Cache rmon binary
        if: github.event_name != 'pull_request'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5 # zizmor: ignore[cache-poisoning]
        id: rmon-cache
        with:
          path: ~/.local/bin/rmon
          key: ${{ runner.os }}-rmon-${{ hashFiles('.github/workflows/ci.yaml') }}
          restore-keys: |
            ${{ runner.os }}-rmon-

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          save-rust-cache: "false"
          rust-cache-shared-key: product-build

      - name: Ensure rmon is installed
        run: |
          if [ ! -x "$HOME/.local/bin/rmon" ]; then
            uv tool install --force git+https://github.com/NatLabRockies/resource_monitor
          fi
          "$HOME/.local/bin/rmon" --version

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CLI benchmarks
        timeout-minutes: 15
        run: |
          uv run python scripts/bench.py \
            --arco-binary target/release/arco \
            --workflows validate,run \
            --repetitions 10 \
            --output artifacts/benchmark-results.json

      - name: Restore previous benchmark data
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        id: benchmark-data-restore
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-main-
            ${{ runner.os }}-benchmark-

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: customSmallerIsBetter
          output-file-path: artifacts/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "125%"
          fail-on-alert: false

      - name: Benchmark regression guard
        run: |
          uv run python scripts/bench_guard.py \
            --current artifacts/benchmark-results.json \
            --baseline cache/benchmark-data.json \
            --ratio-threshold 1.25 \
            --absolute-delta-ms 1.0 \
            --min-baseline-samples 10

      - name: Save benchmark data
        if: github.ref == 'refs/heads/main' && steps.benchmark-data-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}

  python-validation:
    name: Python validation (py${{ matrix.python-version }})
    needs: [version-consistency, ci-plan]
    if: needs.ci-plan.outputs.python == 'true' || needs.ci-plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-cache-shared-key: rust-clippy
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "true"

      - name: Run Python quality checks
        run: just py-check

      - name: Run Python tests
        if: matrix.python-version == '3.12'
        run: just py-test

      - name: Build wheel and validate import
        run: just py-validate-wheel "dist/*.whl"

      - name: Run docs doctests
        if: matrix.python-version == '3.12'
        run: just docs-test

  kdl-examples:
    name: KDL examples
    needs: [ci-plan]
    if: needs.ci-plan.outputs.kdl == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-uv-cache: "false"
          save-rust-cache: "false"

      - name: Run KDL acceptance examples
        run: just test-example-formulations
