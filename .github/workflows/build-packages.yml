name: Build Python and VS Code packages

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  python:
    name: Python release artifacts (${{ matrix.platform.label }}, ${{ matrix.python.label }})
    strategy:
      fail-fast: false
      matrix:
        python:
          - label: cp310
            version: "3.10"
            wheel_features: "pyo3/extension-module,xpress,scip-from-source"
          - label: abi3
            version: "3.11"
            wheel_features: "pyo3/extension-module,pyo3/abi3-py311,xpress,scip-from-source"
        platform:
          - label: linux
            os: ubuntu-22.04
            manylinux: true
            wheel_python: python3
          - label: macos-arm64
            os: macos-14
            manylinux: false
            wheel_python: python3
          - label: windows
            os: windows-latest
            manylinux: false
            wheel_python: python
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.platform.manylinux && 'quay.io/pypa/manylinux_2_28_x86_64@sha256:65140ef21cef92d0c13d001708afd7d304d7a154f7120d039df99dac708f3ffb' || null }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install Rust in manylinux container
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/ci_install_rust_if_missing.sh

      - name: Configure manylinux native dependencies
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/setup_manylinux_native_deps.sh "$GITHUB_ENV"

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        env:
          ARCO_HIGHS_ENABLE_APPLE_STATIC: "1"
        with:
          python-version: ${{ matrix.python.version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: none
          rust-cache-shared-key: release-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          sync-python-licenses: false
          save-uv-cache: false
          save-rust-cache: false
          save-solver-cache: false

      - name: Set up Xpress runtime
        shell: bash
        env:
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: bash scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"

      - name: Build and smoke-test release wheel
        shell: bash
        env:
          PYTHON_WHEEL_COMPATIBILITY: ${{ matrix.platform.manylinux && 'manylinux_2_28' || 'pypi' }}
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.platform.wheel_python }}
          PYTHON_WHEEL_FEATURES: ${{ matrix.python.wheel_features }}
        run: just ci-python-release-wheel "dist/*.whl"

      - name: Verify wheel output
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          }

      - name: Verify Linux wheel target
        if: matrix.platform.manylinux
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*-manylinux_2_28_x86_64.whl)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one manylinux_2_28_x86_64 wheel, found ${#wheels[@]}" >&2
            exit 1
          }

      - name: Build sdist
        if: matrix.platform.label == 'linux' && matrix.python.label == 'abi3'
        shell: bash
        run: just py-build-sdist

      - name: Upload Python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  vscode:
    name: VS Code release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Package VS Code extension
        working-directory: tools/vscode-arco-kdl
        run: |
          set -euo pipefail
          npm run check
          npm run package
          cp arco-kdl-vscode-*.vsix ../../arco-kdl-vscode.vsix

      - name: Upload VS Code artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-vscode
          path: arco-kdl-vscode.vsix
          if-no-files-found: error
          retention-days: 1
