name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode - build artifacts without publishing"
        required: false
        default: false
        type: boolean
      staging:
        description: "Staging mode - publish to TestPyPI and create draft release"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.5.0"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  # ===========================================================================
  # PHASE 1: Release Please - Version and Tag Authority
  # ===========================================================================
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required for release-please to update release manifests, tags, and releases.
      pull-requests: write # Required for release-please to open and maintain release PRs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created || github.event.inputs.dry_run == 'true' || github.event.inputs.staging == 'true' }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.sha || github.sha }}
    steps:
      - name: Run release-please
        id: release
        if: github.event.inputs.dry_run != 'true' && github.event.inputs.staging != 'true'
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # ===========================================================================
  # PHASE 2: Build Phase - Python Wheels and CLI Artifacts (Parallel)
  # ===========================================================================
  build-wheels:
    name: Build wheel ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Build wheel (Linux, PyPI-compatible)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1
        with:
          target: x86_64
          manylinux: auto
          args: >-
            --release
            --manifest-path bindings/python/Cargo.toml
            --out dist
            -i python${{ matrix.python-version }}

      - name: Build wheel (macOS/Windows)
        if: runner.os != 'Linux'
        run: just py-build-ci

      - name: Smoke test wheel install and import
        run: just py-smoke-wheel "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          compression-level: 0
          retention-days: 3

  # ===========================================================================
  # PHASE 2b: Build CLI Artifacts via cargo-dist
  # ===========================================================================
  build-cli-dist:
    name: Build CLI artifacts (cargo-dist)
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      dist_manifest: ${{ steps.dist.outputs.manifest }}
      has_artifacts: ${{ steps.dist.outputs.has_artifacts }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install ${{ env.RUST_TOOLCHAIN_VERSION }}
          rustup default ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install cargo-dist
        run: cargo install cargo-dist

      - name: Build CLI artifacts with cargo-dist
        id: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Generate dist artifacts locally (no publishing)
          cargo dist build --artifacts=global

          # Capture manifest info
          echo "manifest=dist-manifest.json" >> "$GITHUB_OUTPUT"
          echo "has_artifacts=true" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cli-dist-artifacts
          path: target/dist/
          compression-level: 6
          retention-days: 3

      - name: Upload dist manifest
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cli-dist-manifest
          path: dist-manifest.json
          compression-level: 0
          retention-days: 3

  # ===========================================================================
  # PHASE 3: Publish Phase - PyPI and GitHub Release
  # ===========================================================================
  publish-pypi:
    name: Publish to ${{ github.event.inputs.staging == 'true' && 'TestPyPI' || 'PyPI' }}
    needs:
      - release-please
      - build-wheels
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing (OIDC).
    environment:
      name: ${{ github.event.inputs.staging == 'true' && 'testpypi' || 'pypi' }}
      url: ${{ github.event.inputs.staging == 'true' && 'https://test.pypi.org/p/arco' || 'https://pypi.org/p/arco' }}
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish distribution to ${{ github.event.inputs.staging == 'true' && 'TestPyPI' || 'PyPI' }}
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: dist
          repository-url: ${{ github.event.inputs.staging == 'true' && 'https://test.pypi.org/legacy/' || 'https://pypi.org/legacy/' }}
          skip-existing: ${{ github.event.inputs.staging == 'true' }}

  # ===========================================================================
  # PHASE 3b: Assemble Unified Release Notes
  # ===========================================================================
  assemble-release-notes:
    name: Assemble Unified Release Notes
    needs:
      - release-please
      - build-cli-dist
      - publish-pypi
    if: always() && needs.release-please.outputs.release_created == 'true' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_body_path: ${{ steps.assemble.outputs.body_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download dist manifest
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: cli-dist-manifest
          path: dist-manifest

      - name: Assemble release body
        id: assemble
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
          IS_STAGING: ${{ github.event.inputs.staging == 'true' }}
          IS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail

          # Create temp directory for assembly
          mkdir -p release-notes

          # Fetch current release body from release-please
          if [[ "$IS_DRY_RUN" == "true" || "$IS_STAGING" == "true" ]]; then
            # In dry-run/staging mode, generate placeholder
            echo "# Release Notes (Draft - $RELEASE_TAG)" > release-notes/original.md
            echo "" >> release-notes/original.md
            echo "This is a test release for validation purposes." >> release-notes/original.md
          else
            # Fetch actual release body
            gh release view "$RELEASE_TAG" --json body -q '.body' > release-notes/original.md
          fi

          # Extract the changelog section (everything after the first heading)
          cat release-notes/original.md > release-notes/changelog.md

          # Read dist-generated installer snippet if available
          INSTALLER_SECTION=""
          if [[ -f "dist-manifest/dist-manifest.json" ]]; then
            # Parse dist manifest for install hints
            INSTALLER_SECTION=$(cat dist-manifest/dist-manifest.json | jq -r '.install_hints // empty' 2>/dev/null || echo "")
          fi

          # Build Python install section
          PYTHON_SECTION="## Python Package\n\nInstall via pip:\n\n\`\`\`bash\npip install arco\n\`\`\`\n\nOr with uv:\n\n\`\`\`bash\nuv add arco\n\`\`\`\n"

          # Assemble final body
          echo "# Release ${RELEASE_TAG}" > release-notes/final.md
          echo "" >> release-notes/final.md

          # Add Python install section first
          echo -e "$PYTHON_SECTION" >> release-notes/final.md
          echo "" >> release-notes/final.md

          # Add CLI installer section if available
          if [[ -n "$INSTALLER_SECTION" ]]; then
            echo "## CLI Installation" >> release-notes/final.md
            echo "" >> release-notes/final.md
            echo -e "$INSTALLER_SECTION" >> release-notes/final.md
            echo "" >> release-notes/final.md
          else
            echo "## CLI Installation" >> release-notes/final.md
            echo "" >> release-notes/final.md
            echo "Download the appropriate binary for your platform from the assets below." >> release-notes/final.md
            echo "" >> release-notes/final.md
          fi

          # Append original changelog
          cat release-notes/changelog.md >> release-notes/final.md

          # Upload as artifact for inspection
          echo "body_path=release-notes/final.md" >> "$GITHUB_OUTPUT"

          cat release-notes/final.md

      - name: Upload assembled release notes
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: assembled-release-notes
          path: release-notes/final.md
          compression-level: 0
          retention-days: 3

  # ===========================================================================
  # PHASE 4: Final Release Publication
  # ===========================================================================
  publish-github-release:
    name: Publish GitHub Release
    needs:
      - release-please
      - build-wheels
      - build-cli-dist
      - publish-pypi
      - assemble-release-notes
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.build-cli-dist.result == 'success' &&
      needs.publish-pypi.result == 'success' &&
      needs.assemble-release-notes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Required to upload artifacts and publish/edit the GitHub release.
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: artifacts
          merge-multiple: false

      - name: Download assembled release notes
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: assembled-release-notes
          path: release-notes

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
          IS_STAGING: ${{ github.event.inputs.staging == 'true' }}
          IS_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          set -euo pipefail

          # Prepare artifact upload
          mkdir -p upload-artifacts

          # Collect wheel artifacts
          for dir in artifacts/wheel-*; do
            if [[ -d "$dir" ]]; then
              cp "$dir"/*.whl upload-artifacts/ 2>/dev/null || true
            fi
          done

          # Collect CLI artifacts
          if [[ -d "artifacts/cli-dist-artifacts" ]]; then
            cp -r artifacts/cli-dist-artifacts/* upload-artifacts/ 2>/dev/null || true
          fi

          # Determine release flags
          DRAFT_FLAG=""
          if [[ "$IS_STAGING" == "true" || "$IS_DRY_RUN" == "true" ]]; then
            DRAFT_FLAG="--draft"
          fi

          if [[ "$IS_DRY_RUN" == "true" ]]; then
            echo "DRY RUN: Would upload the following artifacts:"
            ls -la upload-artifacts/
            echo ""
            echo "DRY RUN: Release notes content:"
            cat release-notes/final.md
            echo ""
            echo "DRY RUN: Would run: gh release upload \"$RELEASE_TAG\" upload-artifacts/* --repo \"$GH_REPO\" --clobber"
            echo "DRY RUN: Would run: gh release edit \"$RELEASE_TAG\" --repo \"$GH_REPO\" --notes-file release-notes/final.md $DRAFT_FLAG --latest"
          else
            # Upload artifacts to release
            gh release upload "$RELEASE_TAG" upload-artifacts/* --repo "$GH_REPO" --clobber || true

            # Update release notes and mark as final (or draft in staging)
            gh release edit "$RELEASE_TAG" \
              --repo "$GH_REPO" \
              --notes-file release-notes/final.md \
              $DRAFT_FLAG \
              --latest
          fi
