name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.5.0"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for release-please to update release manifests, tags, and releases.
      pull-requests: write # Required for release-please to open and maintain release PRs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_tag: ${{ steps.release.outputs.tag_name }}
      release_version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  build-wheels:
    name: Build wheel ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Build wheel (Linux, PyPI-compatible)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1
        with:
          target: x86_64
          manylinux: auto
          args: >-
            --release
            --manifest-path bindings/python/Cargo.toml
            --out dist
            -i python${{ matrix.python-version }}

      - name: Build wheel (macOS/Windows)
        if: runner.os != 'Linux'
        run: just py-build-ci

      - name: Smoke test wheel install and import
        run: just py-smoke-wheel "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          compression-level: 0

  build-cli-binaries:
    name: Build CLI binaries
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release-cli-binaries.yaml
    with:
      release-sha: ${{ needs.release-please.outputs.release_sha }}
      uv-version: ${{ env.UV_VERSION }}
      just-version: ${{ env.JUST_VERSION }}
      rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}

  publish-pypi:
    name: Publish to PyPI
    needs:
      - release-please
      - build-wheels
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing (OIDC).
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: dist

  publish-github-release:
    name: Publish GitHub Release
    needs:
      - release-please
      - build-wheels
      - build-cli-binaries
      - publish-pypi
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to upload artifacts and publish/edit the GitHub release.
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Upload artifacts and publish release after PyPI succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-please.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --repo "$GH_REPO" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
