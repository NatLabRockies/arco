name: Cargo-dist build

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build
        required: true
        type: string
      source-sha:
        description: Immutable source commit to build
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"
  CARGO_DIST_VERSION: "0.31.0"

jobs:
  plan:
    name: Plan CLI artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifacts_matrix: ${{ steps.plan.outputs.artifacts_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install Cargo-dist
        run: bash scripts/ci_install_dist_unix.sh
        env:
          CARGO_DIST_VERSION: ${{ env.CARGO_DIST_VERSION }}

      - id: plan
        name: Create Cargo-dist plan
        env:
          DIST_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          dist plan --tag="${DIST_TAG}" --output-format=json > plan-dist-manifest.json
          matrix="$(jq -c '.ci.github.artifacts_matrix' plan-dist-manifest.json)"
          [[ "$matrix" != null ]] || { echo "Cargo-dist returned no artifact matrix" >&2; exit 1; }
          printf 'artifacts_matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

      - name: Upload Cargo-dist plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-plan
          path: plan-dist-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  local:
    name: Build CLI (${{ join(matrix.targets, ', ') }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.artifacts_matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 60
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install Rust in container
        if: matrix.container
        run: bash scripts/ci_install_rust_if_missing.sh

      - name: Configure manylinux native dependencies
        if: matrix.container && contains(join(matrix.targets, ','), 'x86_64-unknown-linux-gnu')
        shell: bash
        run: bash scripts/setup_manylinux_native_deps.sh "$GITHUB_ENV"

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        env:
          ARCO_HIGHS_ENABLE_APPLE_STATIC: "1"
          ARCO_HIGHS_TARGETS: ${{ join(matrix.targets, ',') }}
          ARCO_SCIP_TARGETS: ${{ join(matrix.targets, ',') }}
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: none
          rust-cache-shared-key: release-cargo-dist-${{ matrix.host }}
          save-rust-cache: false
          save-uv-cache: false
          save-solver-cache: false

      - name: Set up Xpress runtime
        shell: bash
        env:
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: bash scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"

      - name: Validate Xpress runtime
        shell: bash
        run: bash scripts/ci_validate_xpress_runtime_env.sh

      - name: Install Cargo-dist (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/ci_install_dist_unix.sh
        env:
          CARGO_DIST_VERSION: ${{ env.CARGO_DIST_VERSION }}

      - name: Install Cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci_install_dist_windows.ps1
        env:
          CARGO_DIST_VERSION: ${{ env.CARGO_DIST_VERSION }}

      - name: Download Cargo-dist plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-plan
          path: target/distrib

      - name: Install Cargo-dist build dependencies
        if: matrix.packages_install != ''
        env:
          DIST_PACKAGES_INSTALL: ${{ matrix.packages_install }}
        shell: bash
        run: bash -c "$DIST_PACKAGES_INSTALL"

      - id: cargo-dist
        name: Build Cargo-dist artifacts
        env:
          DIST_ARGS: ${{ matrix.dist_args }}
          DIST_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a dist_args <<< "$DIST_ARGS"
          dist build --tag="${DIST_TAG}" --print=linkage --output-format=json "${dist_args[@]}" > dist-manifest.json
          {
            printf 'paths<<EOF\n'
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
          mkdir -p target/distrib
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Smoke test packaged CLI
        env:
          DIST_MANIFEST: dist-manifest.json
          DIST_TARGET: ${{ matrix.host }}
        shell: bash
        run: |
          set -euo pipefail
          archive_name="$(jq --raw-output --arg target "$DIST_TARGET" '
            .artifacts
            | to_entries[]
            | select(.value.kind == "executable-zip")
            | select(.value.target_triples == [$target])
            | .key
          ' "$DIST_MANIFEST")"
          [[ -n "$archive_name" ]]
          archive="target/distrib/${archive_name}"
          [[ -f "$archive" ]]

          smoke_dir="$(mktemp -d)"
          trap 'rm -rf -- "$smoke_dir"' EXIT
          case "$archive_name" in
            *.tar.gz) tar --extract --gzip --file "$archive" --directory "$smoke_dir" ;;
            *.zip) unzip -q "$archive" -d "$smoke_dir" ;;
            *) printf 'unsupported Cargo-dist archive: %s\n' "$archive_name" >&2; exit 1 ;;
          esac

          packaged_binaries=()
          while IFS= read -r -d '' binary; do
            packaged_binaries+=("$binary")
          done < <(find "$smoke_dir" -type f \( -name arco -o -name arco.exe \) -print0)
          [[ "${#packaged_binaries[@]}" -eq 1 ]]
          "${packaged_binaries[0]}" --version

      - name: Upload Cargo-dist local artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-dist-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  global:
    name: Build CLI installers and checksums
    needs: [plan, local]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install Cargo-dist
        run: bash scripts/ci_install_dist_unix.sh
        env:
          CARGO_DIST_VERSION: ${{ env.CARGO_DIST_VERSION }}

      - name: Download Cargo-dist plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-dist-plan
          path: target/distrib

      - name: Download Cargo-dist local artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cargo-dist-local-*
          path: target/distrib
          merge-multiple: true

      - name: Build Cargo-dist global artifacts
        env:
          DIST_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          dist build --tag="${DIST_TAG}" --artifacts=global --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/dist-manifest.json

      - name: Upload Cargo-dist global artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-cargo-dist-global
          path: |
            target/distrib/*
            !target/distrib/*-dist-manifest.json
            !target/distrib/plan-dist-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90
