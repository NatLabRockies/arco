name: Dispatch PyPI publication

on:
  workflow_call:
    inputs:
      plan:
        description: Cargo-dist release plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch immutable PyPI publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # Dispatch the tag-pinned PyPI workflow.
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
    steps:
      - name: Verify immutable GitHub Release
        run: gh release verify "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Dispatch PyPI publication
        run: gh workflow run publish-pypi.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f "tag=$TAG"
