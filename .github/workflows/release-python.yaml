name: release-python

on:
  push:
    tags:
      - "arco-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run mode - build artifacts without publishing"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.5.0"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  extract-metadata:
    name: Extract release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_dry_run: ${{ steps.meta.outputs.is_dry_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Parse metadata
        id: meta
        run: |
          set -euo pipefail

          IS_DRY_RUN="${{ github.event.inputs.dry_run == 'true' }}"

          if [[ "$GITHUB_REF" == refs/tags/arco-v* ]]; then
            VERSION="${GITHUB_REF_NAME#arco-v}"
            TAG="$GITHUB_REF_NAME"
          else
            # workflow_dispatch: read version from pyproject.toml
            VERSION=$(python3 -c "
          import tomllib, pathlib
          d = tomllib.loads(pathlib.Path('bindings/python/pyproject.toml').read_text())
          print(d['project']['version'])
          ")
            TAG="arco-v${VERSION}"
            IS_DRY_RUN="true"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_dry_run=$IS_DRY_RUN" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Tag: $TAG"
          echo "Dry run: $IS_DRY_RUN"

  build-wheels:
    name: Build wheel ${{ matrix.os }} / py${{ matrix.python-version }}
    needs: extract-metadata
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.extract-metadata.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Build wheel (Linux, PyPI-compatible)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@04ac600d27cdf7a9a280dadf7147097c42b757ad # v1
        with:
          target: x86_64
          manylinux: "2_28"
          before-script-linux: |
            set -euo pipefail
            if command -v dnf >/dev/null 2>&1; then
              dnf install -y clang llvm-devel
            else
              yum install -y clang llvm-devel
            fi
            export LIBCLANG_PATH="$(llvm-config --libdir)"
            ls "$LIBCLANG_PATH"/libclang.so*
          args: >-
            --release --manifest-path bindings/python/Cargo.toml --out dist -i
            python${{ matrix.python-version }}

      - name: Build wheel (macOS/Windows)
        if: runner.os != 'Linux'
        run: just py-build-ci

      - name: Smoke test wheel install and import
        run: just py-smoke-wheel "dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          compression-level: 0
          retention-days: 3

  validate-artifacts:
    name: Validate Python artifacts
    needs:
      - extract-metadata
      - build-wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Validate distributions
        run: uvx twine check dist/*

  publish-pypi:
    name: Publish to PyPI
    needs:
      - extract-metadata
      - build-wheels
      - validate-artifacts
    if: needs.extract-metadata.outputs.is_dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: dist

  update-github-release:
    name: Update GitHub Release (Python)
    needs:
      - extract-metadata
      - build-wheels
      - validate-artifacts
      - publish-pypi
    if: |
      always() &&
      needs.extract-metadata.outputs.is_dry_run != 'true' &&
      needs.validate-artifacts.result == 'success' &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Upload wheels to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.extract-metadata.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/*.whl --repo "$GH_REPO" --clobber

      - name: Add Python install section to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.extract-metadata.outputs.tag }}
        run: |
          set -euo pipefail

          # Fetch current release body
          BODY=$(gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json body -q '.body')

          # Check if Python section is already present
          if echo "$BODY" | grep -q '<!-- python-install -->'; then
            echo "Python install section already present, skipping."
            exit 0
          fi

          # Build Python install section
          PYTHON_SECTION=$(cat <<'SECTION'
          <!-- python-install -->
          ## Python Package

          Install via pip:

          ```bash
          pip install arco
          ```

          Or with uv:

          ```bash
          uv add arco
          ```

          SECTION
          )

          # Prepend to existing body
          UPDATED_BODY="${PYTHON_SECTION}

          ${BODY}"

          echo "$UPDATED_BODY" > /tmp/release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --notes-file /tmp/release-notes.md
