name: Check release assets

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    name: Verify release policy and inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ fromJSON(inputs.plan).announcement_tag }}
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
          digest-mismatch: error

      - name: Check release policy and complete inventory
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = true
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          test "$(jq -r .announcement_tag artifacts/dist-manifest.json)" = "$TAG"
          jq -e '.artifacts | length > 0' artifacts/dist-manifest.json > /dev/null
          while IFS= read -r name; do
            test -f "artifacts/$name"
          done < <(jq -r '.artifacts | keys[]' artifacts/dist-manifest.json)
          version="${TAG#v}"
          shopt -s nullglob
          wheels=(artifacts/arco-"$version"-*.whl)
          sdist=(artifacts/arco-"$version".tar.gz)
          vsix=(artifacts/*.vsix)
          test "${#wheels[@]}" -eq 6
          test "${#sdist[@]}" -eq 1
          test "${#vsix[@]}" -eq 1
