name: Solver Integration

on:
  pull_request:
    paths:
      - "crates/**"
      - "bindings/python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/export_xpress_env_from_python.sh"
      - "scripts/install_ipopt_linux_deps.sh"
      - "scripts/setup_solver_runtime_env.sh"
      - "scripts/solver_docs_smoke.sh"
      - ".github/workflows/solver-integration.yaml"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "bindings/python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/export_xpress_env_from_python.sh"
      - "scripts/install_ipopt_linux_deps.sh"
      - "scripts/setup_solver_runtime_env.sh"
      - "scripts/solver_docs_smoke.sh"
      - ".github/workflows/solver-integration.yaml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  highs-smoke:
    name: HiGHS smoke (docs example)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: solver-integration

      - name: Solve docs example with HiGHS
        run: bash ./scripts/solver_docs_smoke.sh highs

  ipopt-smoke:
    name: IPOPT smoke (docs example)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: bash ./scripts/install_ipopt_linux_deps.sh

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: solver-integration

      - name: Solve docs example with IPOPT
        env:
          FFLAGS: "-fallow-argument-mismatch"
          FCFLAGS: "-fallow-argument-mismatch"
        run: bash ./scripts/solver_docs_smoke.sh ipopt ipopt

  xpress-smoke:
    name: Xpress smoke (docs example)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: solver-integration

      - name: Setup solver runtime env (xpress)
        run: |
          set -euo pipefail
          bash ./scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"
          test -d "$XPRESSDIR/lib"

      - name: Solve docs example with Xpress
        run: bash ./scripts/solver_docs_smoke.sh xpress xpress
