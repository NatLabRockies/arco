name: GitHub Actions Quality

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true

permissions:
  contents: read

jobs:
  checks:
    name: Workflow quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Run actionlint
        uses: kjanat/actionlint@c9565647ad2ff016b50b148a595dfcce50975816 # v1.13.0

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99
        with:
          advanced-security: false
          persona: pedantic
          min-severity: low

      - name: Set up test tools
        uses: $/.github/actions/setup-build-env
        with:
          python-version: "3.12"
          uv-version: "0.9.4"
          just-version: "1.43.0"
          install-rust: "false"
          cache-rust: "false"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"

      - name: Test automation scripts
        run: just script-test

      - name: Install Cargo-dist
        env:
          CARGO_DIST_VERSION: "0.31.0"
        run: bash scripts/ci_install_dist_unix.sh

      - name: Check release plan
        run: dist plan --output-format=json > /dev/null
