name: GitHub Actions Quality

on:
  pull_request:
    paths:
      - ".github/**"
      - "dist-workspace.toml"
      - "scripts/**"
      - ".pre-commit-config.yaml"
      - "bindings/python/tests/test_rust_boundaries.py"
      - "justfile"
  push:
    branches:
      - main
      - release/*
    paths:
      - ".github/**"
      - "dist-workspace.toml"
      - "scripts/**"
      - ".pre-commit-config.yaml"
      - "bindings/python/tests/test_rust_boundaries.py"
      - "justfile"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  script-tests:
    name: Automation script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up test tools
        uses: $/.github/actions/setup-build-env
        with:
          python-version: "3.12"
          uv-version: "0.9.4"
          just-version: "1.43.0"
          install-rust: "false"
          cache-rust: "false"
          cache-uv: "false"
          configure-solvers: "false"
          sync-python-licenses: "false"

      - name: Test automation scripts
        run: just script-test

  dist-config:
    name: Cargo-dist configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Cargo-dist
        env:
          CARGO_DIST_VERSION: "0.31.0"
        run: bash scripts/ci_install_dist_unix.sh

      - name: Check release plan
        run: dist plan --output-format=json > /dev/null

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write # Required by zizmor's SARIF upload.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v1.30.0
        with:
          persona: pedantic
          min-severity: low

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: kjanat/actionlint@c9565647ad2ff016b50b148a595dfcce50975816 # v1.13.0
