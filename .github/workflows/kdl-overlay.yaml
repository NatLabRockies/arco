name: kdl-overlay

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - "**/*.kdl"
      - ".pre-commit-config.yaml"
      - "scripts/check-kdl-overlay.sh"
      - "tools/tree-sitter-arco-kdl/**"
      - "tools/vscode-arco-kdl/**"
      - ".github/workflows/kdl-overlay.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kdl-overlay-check:
    name: kdl overlay parse check
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.1.0
        with:
          node-version: "22"

      - name: Install tree-sitter CLI
        run: npm install --global tree-sitter-cli

      - name: Regenerate generated parser artifacts from grammar source
        working-directory: tools/tree-sitter-arco-kdl
        run: |
          npm ci
          npx tree-sitter generate

      - uses: j178/prek-action@502e92b03ba14f9c5b7dca53a07f9c8349b1e211
        with:
          extra-args: "--all-files --hook-stage manual kdl-overlay-check"

      - name: Run VS Code extension smoke check
        working-directory: tools/vscode-arco-kdl
        run: npm run check
