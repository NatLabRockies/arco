name: kdl-overlay

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - "**/*.kdl"
      - ".pre-commit-config.yaml"
      - "scripts/check-kdl-overlay.sh"
      - "tools/tree-sitter-arco-kdl/**"
      - "tools/vscode-arco-kdl/**"
      - ".github/workflows/kdl-overlay.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kdl-overlay-check:
    name: kdl overlay parse check
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: "22"

      - name: Install tree-sitter CLI
        run: npm install --global tree-sitter-cli

      - name: Regenerate generated parser artifacts from grammar source
        working-directory: tools/tree-sitter-arco-kdl
        run: |
          npm ci
          npx tree-sitter generate

      - uses: j178/prek-action@dec4adcd2fa1db9d50a39668b22112a37235e730
        with:
          extra-args: "--all-files --hook-stage manual kdl-overlay-check"

      - name: Run VS Code extension smoke check
        working-directory: tools/vscode-arco-kdl
        run: npm run check
