name: kdl-overlay

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "**/*.kdl"
      - ".pre-commit-config.yaml"
      - "scripts/check-kdl-overlay.sh"
      - "tools/tree-sitter-arco-kdl/**"
      - "tools/vscode-arco-kdl/**"
      - ".github/workflows/kdl-overlay.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kdl-overlay-check:
    name: kdl overlay parse check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: "22"

      - name: Install tree-sitter dependencies
        working-directory: tools/tree-sitter-arco-kdl
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify generated parser and grammar tests
        working-directory: tools/tree-sitter-arco-kdl
        run: |
          tree-sitter generate
          tree-sitter test
          # Tree-sitter omits the final newline added by repository hooks.
          git diff --exit-code --ignore-space-at-eol -- src/

      - uses: j178/prek-action@e191cc396d739737d801ef04ab315c3e8d933c74
        with:
          extra-args: "--all-files --hook-stage manual kdl-overlay-check"

      - name: Run VS Code extension smoke check
        working-directory: tools/vscode-arco-kdl
        run: npm run check
