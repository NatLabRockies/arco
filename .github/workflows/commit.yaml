name: on-commit

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"

jobs:
  prek:
    name: prek
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: "3.12"
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          sync-python-licenses: "false"
          save-uv-cache: "false"
          save-rust-cache: "false"

      - uses: j178/prek-action@1cd265e68cd39ccf52d58df75540d80750ff5ca4
        with:
          extra-args: "--all-files --hook-stage pre-commit"

  lint-commit-messages:
    name: lint commit message
    if: github.event.action != 'edited'
    runs-on: [ubuntu-latest]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Commitizen check
        run: |
          uvx --from commitizen cz check --rev-range HEAD^!
  lint-pr-title:
    # default: lints titles using https://github.com/commitizen/conventional-commit-types
    name: lint pr title
    runs-on: [ubuntu-latest]
    timeout-minutes: 5
    permissions:
      pull-requests: read # Required by action-semantic-pull-request to read PR title/body.
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
