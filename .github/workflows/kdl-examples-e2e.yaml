name: KDL examples

on:
  pull_request:
    paths:
      - "crates/arco-kdl/**"
      - "crates/arco-cli/**"
      - "**/*.kdl"
      - "justfile"
      - "scripts/test_example_formulations.py"
      - ".github/workflows/kdl-examples-e2e.yaml"
      - ".github/actions/**"
  push:
    branches:
      - main
      - release-*
    paths:
      - "crates/arco-kdl/**"
      - "crates/arco-cli/**"
      - "**/*.kdl"
      - "justfile"
      - "scripts/test_example_formulations.py"
      - ".github/workflows/kdl-examples-e2e.yaml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  run-kdl-examples:
    name: Running KDL examples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          rust-cache-shared-key: rust-clippy
          save-rust-cache: "false"

      - name: Run KDL acceptance examples
        run: just test-example-formulations
