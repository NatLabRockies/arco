name: Benchmarks

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/bench.py"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yaml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/bench.py"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"
  # Enable sparse index for faster crate resolution
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  # Faster cargo builds
  CARGO_INCREMENTAL: 1
  # Faster linking
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # Required to post benchmark summaries/comments back to the PR.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # Cache 1: Rust toolchain (saves ~30s when toolchain already installed)
      - name: Cache Rust toolchain
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: rust-toolchain-cache
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN_VERSION }}-*
            ~/.rustup/update-hashes
          key: ${{ runner.os }}-rust-toolchain-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ hashFiles('rust-toolchain.toml', '.github/workflows/benchmarks.yaml') }}

      # Cache 2: rmon binary (saves ~20-40s avoiding git install)
      - name: Cache rmon binary
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: rmon-cache
        with:
          path: ~/.local/bin/rmon
          key: ${{ runner.os }}-rmon-${{ hashFiles('.github/workflows/benchmarks.yaml') }}
          restore-keys: |
            ${{ runner.os }}-rmon-

      - name: Install Rust toolchain
        if: steps.rust-toolchain-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-action@56bd3e4bf58c7599823db75488bb9866c5afdfb4 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063d26b0ee7fa7bfc6cebd9fd56e85a7b84 # v6
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_LATEST }}

      # Cache 3: Pre-built arco-cli binary (saves ~2-5min when Cargo.lock unchanged)
      - name: Cache arco-cli binary
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: arco-binary-cache
        with:
          path: target/release/arco
          key: ${{ runner.os }}-arco-cli-${{ hashFiles('Cargo.lock', 'crates/arco-cli/**', 'crates/arco_*/**') }}
          restore-keys: |
            ${{ runner.os }}-arco-cli-

      - name: Build arco CLI
        if: steps.arco-binary-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p arco-cli --locked

      - name: Install rmon
        if: steps.rmon-cache.outputs.cache-hit != 'true'
        run: |
          uv tool install git+https://github.com/NatLabRockies/resource_monitor

      # Ensure rmon is in PATH even if cached
      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run CLI benchmarks
        timeout-minutes: 15
        run: |
          python scripts/bench.py \
            --arco-binary target/release/arco \
            --workflows validate,run \
            --repetitions 3 \
            --output artifacts/benchmark-results.json

      # Cache 4: Benchmark data for trend analysis (already exists, but optimized key)
      - name: Restore previous benchmark data
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: benchmark-data-restore
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-benchmark-main-
            ${{ runner.os }}-benchmark-

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@a60cea5bc7b49e15c1f58f411161f99e0df48372 # v1.22.0
        with:
          tool: customSmallerIsBetter
          output-file-path: artifacts/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          comment-on-alert: true
          alert-threshold: "115%"
          fail-on-alert: true

      - name: Save benchmark data
        if: github.ref == 'refs/heads/main' && steps.benchmark-data-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark-${{ github.ref_name }}-${{ github.run_id }}
