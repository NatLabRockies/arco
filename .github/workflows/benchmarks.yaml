name: Benchmarks

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yaml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "benchmarks/**"
      - ".github/workflows/benchmarks.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # Required to post benchmark summaries/comments back to the PR.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          save-rust-cache: "false"
          rust-cache-shared-key: rust-bench

      - name: Build arco-bench
        run: cargo build --release -p arco-bench

      - name: Run monitored benchmark suite
        timeout-minutes: 20
        run: |
          uv run --project benchmarks python -m arco_benchmarks.run_monitored_benchmarks \
            --binary target/release/arco-bench \
            --repo-root . \
            --artifacts-dir artifacts/github-benchmarks \
            --scenarios model-build,kdl-compile \
            --cases 100,1000,10000,100000 \
            --repetitions 3 \
            --sample-interval-seconds 1.0

      - name: Restore previous benchmark data
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
          restore-keys: ${{ runner.os }}-benchmark

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@a60cea5bc7b49e15c1f58f411161f99e0df48372 # v1.22.0
        with:
          tool: customSmallerIsBetter
          output-file-path: artifacts/github-benchmarks/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          comment-on-alert: true
          alert-threshold: "115%"
          fail-on-alert: true

      - name: Save benchmark data
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
