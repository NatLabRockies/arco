name: Benchmarks

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "benchmarks/**"
      - "scripts/bench.py"
      - ".github/workflows/benchmarks.yaml"
  push:
    branches:
      - main
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "benchmarks/**"
      - "scripts/bench.py"
      - ".github/workflows/benchmarks.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # Required to post benchmark summaries/comments back to the PR.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          install-uv: "true"
          sync-python-licenses: "false"
          save-rust-cache: "false"
          rust-cache-shared-key: rust-bench

      - name: Build arco CLI
        run: cargo build --release -p arco-cli

      - name: Install rmon
        run: uv tool install git+https://github.com/NatLabRockies/resource_monitor

      - name: Run CLI benchmarks
        timeout-minutes: 20
        run: |
          python scripts/bench.py \
            --arco-binary target/release/arco \
            --workflows compile,solve \
            --repetitions 3 \
            --output artifacts/benchmark-results.json

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@4cec8772b8f11c76dd218a638840d68b5e4a32e0 # v4.6.2
        with:
          name: benchmark-results
          path: artifacts/
          retention-days: 7

      - name: Restore previous benchmark data
        uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
          restore-keys: ${{ runner.os }}-benchmark

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@a60cea5bc7b49e15c1f58f411161f99e0df48372 # v1.22.0
        with:
          tool: customSmallerIsBetter
          output-file-path: artifacts/benchmark-results.json
          external-data-json-path: ./cache/benchmark-data.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          summary-always: true
          comment-on-alert: true
          alert-threshold: "115%"
          fail-on-alert: true

      - name: Save benchmark data
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: ./cache
          key: ${{ runner.os }}-benchmark
