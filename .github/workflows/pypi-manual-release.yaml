name: Manual PyPI Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish (tag, branch, or SHA)
        required: true
        default: main
        type: string
      skip_existing:
        description: Skip files that already exist on PyPI
        required: true
        default: true
        type: boolean

concurrency:
  group: manual-pypi-release
  cancel-in-progress: false

permissions:
  contents: read

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  py-build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Build wheel and sdist
        run: just py-build-ci

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 3

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: py-build
    permissions:
      id-token: write # Required for PyPI trusted publishing via OIDC.
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: ${{ inputs.skip_existing }}
