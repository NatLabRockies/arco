name: Manual PyPI Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref containing package source to build (tag, branch, or SHA).
        required: true
        default: main
        type: string
      tooling_ref:
        description: Git ref containing current release tooling.
        required: true
        default: main
        type: string
      release_tag:
        description: GitHub Release tag for staged Python distribution assets.
        required: true
        type: string
      platform:
        description: Platform to stage, or all.
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos-x64
          - macos-arm64
          - windows
      python:
        description: Python distribution lane to stage, or all.
        required: true
        default: all
        type: choice
        options:
          - all
          - cp310
          - abi3
      upload_to_release:
        description: Upload staged files to release_tag as GitHub Release assets.
        required: true
        default: true
        type: boolean
      publish:
        description: Publish staged release assets to PyPI after a full all-platform/all-Python stage.
        required: true
        default: false
        type: boolean
      skip_existing:
        description: Skip files that already exist on PyPI when publishing.
        required: true
        default: true
        type: boolean

concurrency:
  group: manual-pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stage-python-distributions:
    name: Stage Python distributions
    uses: ./.github/workflows/python-distributions-stage.yaml
    permissions:
      contents: write # Required to upload staged Python assets to GitHub Releases.
    with:
      source_ref: ${{ inputs.source_ref }}
      tooling_ref: ${{ inputs.tooling_ref }}
      release_tag: ${{ inputs.release_tag }}
      platform: ${{ inputs.platform }}
      python: ${{ inputs.python }}
      upload_to_release: ${{ inputs.upload_to_release }}

  publish-pypi:
    name: Publish staged distributions to PyPI
    needs: stage-python-distributions
    if: inputs.publish && inputs.platform == 'all' && inputs.python == 'all' && inputs.upload_to_release
    uses: ./.github/workflows/pypi-publish-staged.yaml
    permissions:
      contents: read
      id-token: write # Required for PyPI trusted publishing via OIDC.
    with:
      release_tag: ${{ inputs.release_tag }}
      tooling_ref: ${{ inputs.tooling_ref }}
      skip_existing: ${{ inputs.skip_existing }}
