name: Manual PyPI Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and publish (tag, branch, or SHA)
        required: true
        default: main
        type: string
      skip_existing:
        description: Skip files that already exist on PyPI
        required: true
        default: true
        type: boolean
      release_tag:
        description: GitHub Release tag to receive rebuilt Python artifacts
        required: false
        default: ""
        type: string
      upload_to_release:
        description: Upload rebuilt Python artifacts to the GitHub Release
        required: true
        default: false
        type: boolean

concurrency:
  group: manual-pypi-release
  cancel-in-progress: false

permissions:
  contents: read

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  py-build:
    name: Build Python distributions (${{ matrix.platform.label }}, ${{ matrix.python.label }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 15
    permissions:
      contents: write # Required when upload_to_release publishes artifacts to a GitHub Release.
    strategy:
      fail-fast: false
      matrix:
        python:
          - label: cp310
            version: "3.10"
            wheel_features: ""
          - label: abi3
            version: "3.11"
            wheel_features: "pyo3/extension-module,pyo3/abi3-py311,xpress"
        platform:
          - label: linux
            os: ubuntu-latest
            wheel_python: python3
          - label: macos-arm64
            os: macos-14
            wheel_python: python3
          - label: windows
            os: windows-latest
            wheel_python: python
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python.version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Build wheel
        shell: bash
        env:
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.platform.wheel_python }}
          PYTHON_WHEEL_FEATURES: ${{ matrix.python.wheel_features }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # TODO: After the next release, remove this tag-rebuild compatibility override.
            # New release refs should rely on the justfile's windows-shell setting instead.
            just --shell "C:/Program Files/Git/bin/bash.exe" --shell-arg "-eu" --shell-arg "-o" --shell-arg "pipefail" --shell-arg "-c" py-build-wheel
          else
            just py-build-wheel
          fi

      - name: Build sdist
        if: matrix.platform.label == 'linux' && matrix.python.label == 'abi3'
        shell: bash
        run: just py-build-sdist

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ matrix.platform.label }}-${{ matrix.python.label }}
          path: dist/
          retention-days: 3

      - name: Upload Python distributions to release
        if: inputs.upload_to_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required when upload_to_release is true" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: py-build
    permissions:
      id-token: write # Required for PyPI trusted publishing via OIDC.
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: ${{ inputs.skip_existing }}
