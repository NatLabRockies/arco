name: release-cli-binaries

on:
  workflow_call:
    inputs:
      release-sha:
        required: true
        type: string
      release-version:
        required: true
        type: string
      uv-version:
        required: true
        type: string
      just-version:
        required: true
        type: string
      rust-toolchain-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-cli-binaries:
    name: Build CLI binary ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.release-sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust build environment
        uses: ./.github/actions/setup-rust-validation-env
        with:
          python-version: "3.12"
          uv-version: ${{ inputs.uv-version }}
          just-version: ${{ inputs.just-version }}
          rust-toolchain-version: ${{ inputs.rust-toolchain-version }}

      - name: Build arco CLI binary
        run: cargo build -p arco-cli --release --locked --target-dir dist

      - name: Smoke test CLI (Unix)
        if: runner.os != 'Windows'
        run: ./dist/release/arco --help

      - name: Smoke test CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/release/arco.exe --help

      - name: Prepare CLI artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          target_triple="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p dist
          cp dist/release/arco "dist/arco-cli-v${RELEASE_VERSION}-${target_triple}"

      - name: Prepare CLI artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targetTriple = ((rustc -vV | Select-String '^host:').ToString().Split()[1])
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "dist/release/arco.exe" "dist/arco-cli-v$env:RELEASE_VERSION-$targetTriple.exe"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cli-${{ matrix.os }}
          path: dist/arco-cli-v*
          compression-level: 0
          retention-days: 3
