name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required for creating/updating release commits, tags, and GitHub releases.
      pull-requests: write # Required for opening and updating release PRs.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  cargo-dist:
    name: Build and publish release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write # Required because the called workflow uploads release artifacts to GitHub Releases.
    uses: ./.github/workflows/cargo-dist-release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  update-release-notes:
    name: Append install instructions
    needs: [release-please, cargo-dist]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Required to append generated install instructions to the published release notes.
    steps:
      - name: Download dist-manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts-dist-manifest
          path: .

      - name: Append install instructions to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          install_body=$(jq -r '.announcement_github_body // empty' dist-manifest.json)
          if [[ -z "$install_body" ]]; then
            echo "No install instructions found in dist-manifest.json"
            exit 0
          fi
          current_body=$(gh release view "$TAG" --json body --jq '.body')
          printf '%s\n\n---\n\n%s' "$current_body" "$install_body" > release-body.md
          gh release edit "$TAG" --notes-file release-body.md

  py-build:
    name: Python Build Artifacts
    timeout-minutes: 15
    permissions:
      contents: read
    needs: [release-please, cargo-dist]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Build package
        run: just py-build-ci

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 3

  publish-pypi:
    name: Publish to PyPI
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI trusted publishing via OIDC.
    needs:
      - py-build
      - cargo-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
