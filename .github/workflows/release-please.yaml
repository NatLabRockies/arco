name: release-please

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create release PRs and tags
      pull-requests: write # required to open/update release PRs
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-release: true

  dispatch-dist-release:
    name: dispatch dist release
    runs-on: ubuntu-latest
    needs: release-please
    if: "${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore(main): release ')) }}"
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      actions: write # required to dispatch generated cargo-dist workflow
      contents: read # required to read Cargo.toml and releases
      issues: write # required to update PR labels
      pull-requests: write # required to update release PR lifecycle labels
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: version
        name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_ws = 1; next }
            /^\[/ && in_ws { in_ws = 0 }
            in_ws && /^version = / { print $2; exit }
          ' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "Could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Dispatch cargo-dist release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          output="$(gh workflow run v-release.yml --ref "$REF_NAME" --field tag="$TAG" 2>&1)"
          echo "$output"
          # Parse the run URL from gh CLI output (gh v2.87+ returns it)
          run_url="$(echo "$output" | grep -oE 'https?://[^ ]+' | head -1)"
          if [[ -n "$run_url" ]]; then
            run_id="$(echo "$run_url" | grep -oP '/runs/\K\d+')"
            if [[ -n "$run_id" ]]; then
              echo "run_url=$run_url" >> "$GITHUB_ENV"
              echo "run_id=$run_id" >> "$GITHUB_ENV"
              echo "::notice::Dispatched run: $run_url"
            fi
          else
            echo "::warning::Could not capture run URL from gh workflow run output."
          fi

      - name: Wait for cargo-dist release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${run_id:-}" ]]; then
            # gh run watch polls until completion and exits non-zero on failure
            echo "Watching dispatched run: ${run_url:-unknown}"
            if gh run watch "$run_id" --exit-status 2>&1; then
              echo "::notice::cargo-dist workflow completed successfully."
              exit 0
            else
              echo "::error::cargo-dist workflow failed. See: ${run_url:-unknown}"
              exit 1
            fi
          fi

          # Fallback: poll for GitHub Release appearance
          echo "Falling back to release polling..."
          for attempt in {1..60}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG is published."
              exit 0
            fi
            echo "Waiting for cargo-dist to publish $TAG (${attempt}/60)..."
            sleep 60
          done

          echo "Timed out waiting for cargo-dist to publish $TAG" >&2
          exit 1

      - name: Mark release PR as tagged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPOSITORY}/commits/${RELEASE_COMMIT}/pulls" \
            --jq '.[] | select(.merged_at != null and ((.title | startswith("chore: release ")) or (.title | startswith("chore(main): release ")))) | .number' \
            | head -n 1)"

          if [[ -z "$pr_number" ]]; then
            echo "No merged release PR found for commit ${RELEASE_COMMIT}" >&2
            exit 1
          fi

          gh label create "autorelease: tagged" --color "0e8a16" --description "Release PR has been tagged" --force
          gh pr edit "$pr_number" --remove-label "autorelease: pending" || true
          gh pr edit "$pr_number" --add-label "autorelease: tagged"

  upload-vscode-extension:
    name: Upload VS Code extension
    runs-on: ubuntu-latest
    needs:
      - dispatch-dist-release
    if: needs.dispatch-dist-release.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: write # required to upload the VS Code extension asset to the GitHub Release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.dispatch-dist-release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Package VS Code extension
        working-directory: tools/vscode-arco-kdl
        run: |
          set -euo pipefail
          npm run check
          npm run package
          cp arco-kdl-vscode-*.vsix ../../arco-kdl-vscode.vsix

      - name: Upload VS Code extension to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.dispatch-dist-release.outputs.tag }}
        run: gh release upload "$TAG" arco-kdl-vscode.vsix --clobber

  py-build:
    name: Python Build Artifacts (${{ matrix.platform.label }}, ${{ matrix.python.label }})
    timeout-minutes: 15
    permissions:
      contents: write # Required to upload Python distribution assets to the GitHub Release.
    needs:
      - dispatch-dist-release
    if: needs.dispatch-dist-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        python:
          - label: cp310
            version: "3.10"
            wheel_features: ""
          - label: abi3
            version: "3.11"
            wheel_features: "pyo3/extension-module,pyo3/abi3-py311,xpress"
        platform:
          - label: linux
            os: ubuntu-latest
            wheel_python: python3
          - label: macos-arm64
            os: macos-14
            wheel_python: python3
          - label: windows
            os: windows-latest
            wheel_python: python
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.dispatch-dist-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ matrix.python.version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: "none"
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Build wheel
        shell: bash
        env:
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.platform.wheel_python }}
          PYTHON_WHEEL_FEATURES: ${{ matrix.python.wheel_features }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            # TODO: After the next release, remove this tag-rebuild compatibility override.
            # New release refs should rely on the justfile's windows-shell setting instead.
            just --shell "C:/Program Files/Git/bin/bash.exe" --shell-arg "-eu" --shell-arg "-o" --shell-arg "pipefail" --shell-arg "-c" py-build-wheel
          else
            just py-build-wheel
          fi

      - name: Build sdist
        if: matrix.platform.label == 'linux' && matrix.python.label == 'abi3'
        shell: bash
        run: just py-build-sdist

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ matrix.platform.label }}-${{ matrix.python.label }}
          path: dist/
          retention-days: 3

      - name: Upload Python distributions to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.dispatch-dist-release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI trusted publishing via OIDC.
    needs:
      - dispatch-dist-release
      - py-build
    if: needs.dispatch-dist-release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          skip-existing: true
