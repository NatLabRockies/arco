name: release-please

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

# Keep in sync with ci.yaml
env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create release PRs and tags
      pull-requests: write # required to open/update release PRs
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          skip-github-release: true

  dispatch-dist-release:
    name: dispatch dist release
    runs-on: ubuntu-latest
    needs: release-please
    if: "${{ github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'chore: release ') || startsWith(github.event.head_commit.message, 'chore(main): release ')) }}"
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      actions: write # required to dispatch generated cargo-dist workflow
      contents: read # required to read Cargo.toml and releases
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - id: version
        name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F '"' '
            /^\[workspace\.package\]$/ { in_ws = 1; next }
            /^\[/ && in_ws { in_ws = 0 }
            in_ws && /^version = / { print $2; exit }
          ' Cargo.toml)"
          if [[ -z "$version" ]]; then
            echo "Could not read workspace version from Cargo.toml" >&2
            exit 1
          fi
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Dispatch cargo-dist release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: gh workflow run v-release.yml --ref "$REF_NAME" --field tag="$TAG"

      - name: Wait for cargo-dist release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for attempt in {1..60}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG is published."
              exit 0
            fi
            echo "Waiting for cargo-dist to publish $TAG (${attempt}/60)..."
            sleep 60
          done

          echo "Timed out waiting for cargo-dist to publish $TAG" >&2
          exit 1

  upload-vscode-extension:
    name: Upload VS Code extension
    runs-on: ubuntu-latest
    needs:
      - dispatch-dist-release
    if: needs.dispatch-dist-release.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: write # required to upload the VS Code extension asset to the GitHub Release
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.dispatch-dist-release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Package VS Code extension
        working-directory: tools/vscode-arco-kdl
        run: |
          set -euo pipefail
          npm run check
          npm run package
          cp arco-kdl-vscode-*.vsix ../../arco-kdl-vscode.vsix

      - name: Upload VS Code extension to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.dispatch-dist-release.outputs.tag }}
        run: gh release upload "$TAG" arco-kdl-vscode.vsix --clobber

  py-build:
    name: Python Build Artifacts (${{ matrix.label }})
    timeout-minutes: 15
    permissions:
      contents: read
    needs:
      - dispatch-dist-release
    if: needs.dispatch-dist-release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            build_sdist: true
            wheel_python: python3
          - label: windows
            os: windows-latest
            build_sdist: false
            wheel_python: python
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.dispatch-dist-release.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env
        with:
          python-version: ${{ env.PYTHON_LATEST }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          save-rust-cache: "false"
          save-uv-cache: "false"

      - name: Build wheel
        env:
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.wheel_python }}
        run: just py-build-wheel

      - name: Build sdist
        if: matrix.build_sdist
        run: just py-build-sdist

      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions-${{ matrix.label }}
          path: dist/
          retention-days: 3

  upload-python-distributions:
    name: Upload Python distributions
    runs-on: ubuntu-latest
    needs:
      - dispatch-dist-release
      - py-build
    if: needs.dispatch-dist-release.result == 'success'
    timeout-minutes: 5
    permissions:
      contents: write # required to upload Python distribution assets to the GitHub Release
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true

      - name: Upload Python distributions to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.dispatch-dist-release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-pypi:
    name: Publish to PyPI
    timeout-minutes: 10
    permissions:
      id-token: write # Required for PyPI trusted publishing via OIDC.
    needs:
      - dispatch-dist-release
      - py-build
      - upload-python-distributions
      - upload-vscode-extension
    if: needs.dispatch-dist-release.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
