name: Release

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable GitHub Release tag to retry on PyPI
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  release-please:
    name: Release Please
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release Please creates the draft release and tag.
      pull-requests: write # Release Please opens and updates the release PR.
    outputs:
      should-release: ${{ steps.release.outputs.release_created == 'true' || steps.release.outputs.tag_name != '' || steps.retry.outputs.tag_name != '' }}
      tag-name: ${{ steps.release.outputs.tag_name || steps.retry.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - id: retry
        name: Reuse release tag on retry
        if: github.event_name == 'push' && steps.release.outputs.release_created != 'true'
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          subject="${HEAD_COMMIT_MESSAGE%%$'\n'*}"
          if [[ "$subject" =~ ^chore:\ release\ (v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]]; then
            printf 'tag_name=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

  cargo-dist:
    name: Cargo-dist release artifacts
    needs: release-please
    if: needs.release-please.outputs.should-release == 'true'
    uses: $/.github/workflows/cargo-dist-build.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}

  python:
    name: Python release artifacts (${{ matrix.platform.label }}, ${{ matrix.python.label }})
    needs: release-please
    if: needs.release-please.outputs.should-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        python:
          - label: cp310
            version: "3.10"
            wheel_features: "pyo3/extension-module,xpress,scip-from-source"
          - label: abi3
            version: "3.11"
            wheel_features: "pyo3/extension-module,pyo3/abi3-py311,xpress,scip-from-source"
        platform:
          - label: linux
            os: ubuntu-22.04
            manylinux: true
            wheel_python: python3
          - label: macos-arm64
            os: macos-14
            manylinux: false
            wheel_python: python3
          - label: windows
            os: windows-latest
            manylinux: false
            wheel_python: python
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.platform.manylinux && 'quay.io/pypa/manylinux_2_28_x86_64@sha256:65140ef21cef92d0c13d001708afd7d304d7a154f7120d039df99dac708f3ffb' || null }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install Rust in manylinux container
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/ci_install_rust_if_missing.sh

      - name: Configure manylinux native dependencies
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/setup_manylinux_native_deps.sh "$GITHUB_ENV"

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        env:
          ARCO_HIGHS_ENABLE_APPLE_STATIC: "1"
        with:
          python-version: ${{ matrix.python.version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: none
          rust-cache-shared-key: release-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          sync-python-licenses: false
          save-uv-cache: false
          save-rust-cache: false
          save-solver-cache: false

      - name: Check wheel build configuration
        if: matrix.platform.manylinux && matrix.python.label == 'abi3'
        run: uv run --no-project --with pytest pytest scripts/test_build_python_wheel.py -q

      - name: Set up Xpress runtime
        shell: bash
        env:
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: bash scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"

      - name: Build wheel
        shell: bash
        env:
          PYTHON_WHEEL_COMPATIBILITY: ${{ matrix.platform.manylinux && 'manylinux_2_28' || 'pypi' }}
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.platform.wheel_python }}
          PYTHON_WHEEL_FEATURES: ${{ matrix.python.wheel_features }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            just --shell "C:/Program Files/Git/bin/bash.exe" --shell-arg "-eu" --shell-arg "-o" --shell-arg "pipefail" --shell-arg "-c" py-build-release-wheel
          else
            just py-build-release-wheel
          fi

      - name: Verify wheel output
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          }

      - name: Verify Linux wheel target
        if: matrix.platform.manylinux
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*-manylinux_2_28_x86_64.whl)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one manylinux_2_28_x86_64 wheel, found ${#wheels[@]}" >&2
            exit 1
          }

      - name: Build sdist
        if: matrix.platform.label == 'linux' && matrix.python.label == 'abi3'
        shell: bash
        run: just py-build-sdist

      - name: Upload Python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  vscode:
    name: VS Code release artifact
    needs: release-please
    if: needs.release-please.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Package VS Code extension
        working-directory: tools/vscode-arco-kdl
        run: |
          set -euo pipefail
          npm run check
          npm run package
          cp arco-kdl-vscode-*.vsix ../../arco-kdl-vscode.vsix

      - name: Upload VS Code artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-vscode
          path: arco-kdl-vscode.vsix
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: [release-please, cargo-dist, python, vscode]
    if: >-
      always() &&
      needs.release-please.outputs.should-release == 'true' &&
      needs.cargo-dist.result == 'success' &&
      needs.python.result == 'success' &&
      needs.vscode.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Upload and publish the GitHub Release.
      actions: read # Download artifacts produced by the build jobs.
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          path: release-files
          merge-multiple: true
          digest-mismatch: error

      - name: Verify release inventory
        env:
          TAG: ${{ needs.release-please.outputs.tag-name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          shopt -s nullglob
          wheels=(release-files/arco-"${version}"-*.whl)
          [[ "${#wheels[@]}" -eq 6 ]]
          [[ -f "release-files/arco-${version}-cp310-cp310-manylinux_2_28_x86_64.whl" ]]
          [[ -f "release-files/arco-${version}-cp311-abi3-manylinux_2_28_x86_64.whl" ]]
          test "$(compgen -G "release-files/arco-${version}-cp310-cp310-macosx-*_arm64.whl" | wc -l)" -eq 1
          test "$(compgen -G "release-files/arco-${version}-cp311-abi3-macosx-*_arm64.whl" | wc -l)" -eq 1
          test "$(compgen -G "release-files/arco-${version}-cp310-cp310-win_amd64.whl" | wc -l)" -eq 1
          test "$(compgen -G "release-files/arco-${version}-cp311-abi3-win_amd64.whl" | wc -l)" -eq 1
          [[ -f "release-files/arco-${version}.tar.gz" ]]
          vsix=(release-files/*.vsix)
          [[ "${#vsix[@]}" -eq 1 ]]
          test "$(find release-files -maxdepth 1 -name '*dist-manifest.json' | wc -l)" -gt 0
          test "$(find release-files -maxdepth 1 -name '*.sha256' | wc -l)" -gt 0

      - name: Reconcile and publish release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag-name }}
        run: |
          set -euo pipefail
          release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId,isDraft,isImmutable)"
          is_draft="$(jq -r '.isDraft' <<<"$release")"
          is_immutable="$(jq -r '.isImmutable' <<<"$release")"
          [[ "$is_draft" == true || "$is_immutable" == true ]] || {
            echo "release is neither a draft nor an immutable published release" >&2
            exit 1
          }
          release_id="$(jq -r '.databaseId' <<<"$release")"
          assets="$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" | jq -s 'add')"
          missing=()
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            remote_digest="$(jq -r --arg name "$name" '[.[] | select(.name == $name) | .digest] | first // empty' <<<"$assets")"
            if [[ -n "$remote_digest" ]]; then
              local_digest="sha256:$(sha256sum "$path" | cut -d' ' -f1)"
              [[ "$remote_digest" == "$local_digest" ]] || {
                echo "existing release asset has a different digest: ${name}" >&2
                exit 1
              }
            else
              [[ "$is_draft" == true ]] || {
                echo "published immutable release is missing asset: ${name}" >&2
                exit 1
              }
              missing+=("$path")
            fi
          done < <(find release-files -maxdepth 1 -type f -print0)
          if ((${#missing[@]})); then
            gh release upload "$TAG" "${missing[@]}" --repo "$GITHUB_REPOSITORY"
          fi
          assets="$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" | jq -s 'add')"
          expected="$(find release-files -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(jq -r '.[].name' <<<"$assets" | sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "release assets do not match the release inventory" >&2
            exit 1
          }
          if [[ "$is_draft" == true ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            echo "immutable release already published"
          fi

  publish-pypi:
    name: Publish Python packages
    needs: [release-please, publish-release]
    if: >-
      always() &&
      (needs.publish-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing uses GitHub OIDC.
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag-name }}
    steps:
      - name: Verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable --jq 'select(.isDraft == false and .isImmutable == true) | "valid"')" = valid

      - name: Download Python assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern "arco-*.whl" \
            --pattern "arco-${TAG#v}.tar.gz"
          version="${TAG#v}"
          shopt -s nullglob
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 6 ]]
          [[ -f "dist/arco-${version}-cp310-cp310-manylinux_2_28_x86_64.whl" ]]
          [[ -f "dist/arco-${version}-cp311-abi3-manylinux_2_28_x86_64.whl" ]]
          test "$(compgen -G "dist/arco-${version}-cp310-cp310-macosx-*_arm64.whl" | wc -l)" -eq 1
          test "$(compgen -G "dist/arco-${version}-cp311-abi3-macosx-*_arm64.whl" | wc -l)" -eq 1
          test "$(compgen -G "dist/arco-${version}-cp310-cp310-win_amd64.whl" | wc -l)" -eq 1
          test "$(compgen -G "dist/arco-${version}-cp311-abi3-win_amd64.whl" | wc -l)" -eq 1
          [[ -f "dist/arco-${version}.tar.gz" ]]

      - name: Publish exact files to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          skip-existing: true
