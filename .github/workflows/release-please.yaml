name: Release

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      tag:
        description: Published immutable GitHub Release tag to retry on PyPI
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  release-please:
    name: Release Please
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release Please creates the draft release and tag.
      pull-requests: write # Release Please opens and updates the release PR.
      actions: read # Detect a frozen candidate from an earlier attempt.
    outputs:
      should-release: ${{ steps.ready.outputs.tag != '' }}
      tag-name: ${{ steps.ready.outputs.tag }}
      has-candidate: ${{ steps.candidate.outputs.exists }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - id: existing
        name: Resolve existing release for this commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: uv run --no-project python scripts/release_pipeline.py resolve

      - id: release
        if: steps.existing.outputs.tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - id: ready
        name: Verify release tag identifies this commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: uv run --no-project python scripts/release_pipeline.py resolve

      - name: Require repository release immutability
        if: steps.ready.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: uv run --no-project python scripts/release_pipeline.py preflight

      - id: candidate
        name: Find candidate from an earlier attempt
        if: steps.ready.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ready.outputs.tag }}
        run: uv run --no-project python scripts/release_pipeline.py candidate --tag "$TAG"

  cargo-dist:
    name: Cargo-dist release artifacts
    needs: release-please
    if: needs.release-please.outputs.should-release == 'true' && needs.release-please.outputs.has-candidate != 'true'
    uses: $/.github/workflows/cargo-dist-build.yaml
    with:
      tag: ${{ needs.release-please.outputs.tag-name }}
      source-sha: ${{ github.sha }}

  python:
    name: Python release artifacts (${{ matrix.platform.label }}, ${{ matrix.python.label }})
    needs: release-please
    if: needs.release-please.outputs.should-release == 'true' && needs.release-please.outputs.has-candidate != 'true'
    strategy:
      fail-fast: false
      matrix:
        python:
          - label: cp310
            version: "3.10"
            wheel_features: "pyo3/extension-module,xpress,scip-from-source"
          - label: abi3
            version: "3.11"
            wheel_features: "pyo3/extension-module,pyo3/abi3-py311,xpress,scip-from-source"
        platform:
          - label: linux
            os: ubuntu-22.04
            manylinux: true
            wheel_python: python3
          - label: macos-arm64
            os: macos-14
            manylinux: false
            wheel_python: python3
          - label: windows
            os: windows-latest
            manylinux: false
            wheel_python: python
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.platform.manylinux && 'quay.io/pypa/manylinux_2_28_x86_64@sha256:65140ef21cef92d0c13d001708afd7d304d7a154f7120d039df99dac708f3ffb' || null }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: recursive

      - name: Install Rust in manylinux container
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/ci_install_rust_if_missing.sh

      - name: Configure manylinux native dependencies
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/setup_manylinux_native_deps.sh "$GITHUB_ENV"

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        env:
          ARCO_HIGHS_ENABLE_APPLE_STATIC: "1"
        with:
          python-version: ${{ matrix.python.version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: none
          rust-cache-shared-key: release-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          sync-python-licenses: false
          save-uv-cache: false
          save-rust-cache: false
          save-solver-cache: false

      - name: Check wheel build configuration
        if: matrix.platform.manylinux && matrix.python.label == 'abi3'
        run: uv run --no-project --with pytest pytest scripts/test_build_python_wheel.py -q

      - name: Set up Xpress runtime
        shell: bash
        env:
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: bash scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"

      - name: Build wheel
        shell: bash
        env:
          PYTHON_WHEEL_COMPATIBILITY: ${{ matrix.platform.manylinux && 'manylinux_2_28' || 'pypi' }}
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.platform.wheel_python }}
          PYTHON_WHEEL_FEATURES: ${{ matrix.python.wheel_features }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            just --shell "C:/Program Files/Git/bin/bash.exe" --shell-arg "-eu" --shell-arg "-o" --shell-arg "pipefail" --shell-arg "-c" py-build-release-wheel
          else
            just py-build-release-wheel
          fi

      - name: Install and smoke-test release wheel
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            just --shell "C:/Program Files/Git/bin/bash.exe" --shell-arg "-eu" --shell-arg "-o" --shell-arg "pipefail" --shell-arg "-c" py-smoke-wheel "dist/*.whl"
          else
            just py-smoke-wheel "dist/*.whl"
          fi

      - name: Verify wheel output
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one wheel, found ${#wheels[@]}" >&2
            exit 1
          }

      - name: Verify Linux wheel target
        if: matrix.platform.manylinux
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*-manylinux_2_28_x86_64.whl)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one manylinux_2_28_x86_64 wheel, found ${#wheels[@]}" >&2
            exit 1
          }

      - name: Build sdist
        if: matrix.platform.label == 'linux' && matrix.python.label == 'abi3'
        shell: bash
        run: just py-build-sdist

      - name: Upload Python artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  vscode:
    name: VS Code release artifact
    needs: release-please
    if: needs.release-please.outputs.should-release == 'true' && needs.release-please.outputs.has-candidate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Package VS Code extension
        working-directory: tools/vscode-arco-kdl
        run: |
          set -euo pipefail
          npm run check
          npm run package
          cp arco-kdl-vscode-*.vsix ../../arco-kdl-vscode.vsix

      - name: Upload VS Code artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-vscode
          path: arco-kdl-vscode.vsix
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  assemble:
    name: Freeze validated release candidate
    needs: [release-please, cargo-dist, python, vscode]
    if: >-
      always() &&
      needs.release-please.outputs.should-release == 'true' &&
      needs.release-please.outputs.has-candidate != 'true' &&
      needs.cargo-dist.result == 'success' &&
      needs.python.result == 'success' &&
      needs.vscode.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          path: release-files
          merge-multiple: true
          digest-mismatch: error

      - name: Verify complete release inventory
        env:
          TAG: ${{ needs.release-please.outputs.tag-name }}
        run: uv run --no-project python scripts/release_pipeline.py verify --tag "$TAG" --directory release-files

      - name: Preserve validated candidate for publication and retries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: release-files/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: [release-please, assemble]
    if: >-
      always() &&
      needs.release-please.outputs.should-release == 'true' &&
      (needs.assemble.result == 'success' || needs.release-please.outputs.has-candidate == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Upload and publish the GitHub Release.
      actions: read # Download the frozen candidate from this workflow run.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Download frozen release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: release-files
          digest-mismatch: error

      - name: Verify, reconcile, and publish release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          TAG: ${{ needs.release-please.outputs.tag-name }}
        run: uv run --no-project python scripts/release_pipeline.py publish --tag "$TAG" --directory release-files

  publish-pypi:
    name: Publish Python packages
    needs: [release-please, publish-release]
    if: >-
      always() &&
      (needs.publish-release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing uses GitHub OIDC.
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag-name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Download and verify immutable Python assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/release_pipeline.py download-python --tag "$TAG" --directory dist

      - name: Publish exact files to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          skip-existing: true
