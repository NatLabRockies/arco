name: Release candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: release-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read # Required to classify Release Please pull requests.

env:
  UV_VERSION: "0.9.4"
  JUST_VERSION: "1.43.0"
  PYTHON_LATEST: "3.12"
  RUST_TOOLCHAIN_VERSION: "1.85"

jobs:
  classify:
    name: Classify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
      version: ${{ steps.classify.outputs.version }}
    steps:
      - id: classify
        name: Check Release Please identity
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        shell: bash
        run: |
          set -euo pipefail
          eligible=false
          version=""
          if [[ "$BASE_REF" == "main" || "$BASE_REF" == release/* ]] \
            && [[ "$HEAD_REF" == release-please--branches--* ]] \
            && [[ "$AUTHOR_TYPE" == "Bot" ]] \
            && [[ "$TITLE" =~ ^chore:\ release\ v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]]; then
            eligible=true
            version="${BASH_REMATCH[1]}"
          fi
          printf 'eligible=%s\n' "$eligible" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          echo "release-candidate eligible=$eligible version=${version:-none}"

  cargo-dist:
    name: Cargo-dist candidate
    needs: classify
    if: needs.classify.outputs.eligible == 'true'
    uses: $/.github/workflows/cargo-dist-build.yaml
    with:
      checkout-ref: refs/pull/${{ github.event.pull_request.number }}/merge

  python:
    name: Python candidate (${{ matrix.platform.label }}, ${{ matrix.python.label }})
    needs: classify
    if: needs.classify.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        python:
          - label: cp310
            version: "3.10"
            wheel_features: "pyo3/extension-module,xpress,scip-from-source"
          - label: abi3
            version: "3.11"
            wheel_features: "pyo3/extension-module,pyo3/abi3-py311,xpress,scip-from-source"
        platform:
          - label: linux
            os: ubuntu-22.04
            manylinux: true
            wheel_python: python3
          - label: macos-arm64
            os: macos-14
            wheel_python: python3
          - label: windows
            os: windows-latest
            wheel_python: python
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.platform.manylinux && 'quay.io/pypa/manylinux_2_28_x86_64@sha256:65140ef21cef92d0c13d001708afd7d304d7a154f7120d039df99dac708f3ffb' || null }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust in manylinux container
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/ci_install_rust_if_missing.sh

      - name: Configure manylinux native dependencies
        if: matrix.platform.manylinux
        shell: bash
        run: bash scripts/setup_manylinux_native_deps.sh "$GITHUB_ENV"

      - name: Set up build environment
        uses: $/.github/actions/setup-build-env
        env:
          ARCO_HIGHS_ENABLE_APPLE_STATIC: "1"
        with:
          python-version: ${{ matrix.python.version }}
          uv-version: ${{ env.UV_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
          rust-toolchain-version: ${{ env.RUST_TOOLCHAIN_VERSION }}
          rust-components: none
          rust-cache-shared-key: candidate-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          sync-python-licenses: false
          save-uv-cache: false
          save-rust-cache: false

      - name: Check wheel build configuration
        if: matrix.platform.manylinux && matrix.python.label == 'abi3'
        run: uv run --no-project --with pytest pytest scripts/test_build_python_wheel.py -q

      - name: Set up Xpress runtime
        shell: bash
        env:
          XPRESS_SDK_LINUX_URL: ${{ vars.XPRESS_SDK_LINUX_URL }}
          XPRESS_SDK_MACOS_URL: ${{ vars.XPRESS_SDK_MACOS_URL }}
          XPRESS_SDK_WINDOWS_URL: ${{ vars.XPRESS_SDK_WINDOWS_URL }}
        run: bash scripts/setup_solver_runtime_env.sh xpress "$GITHUB_ENV"

      - name: Build wheel
        shell: bash
        env:
          PYTHON_WHEEL_COMPATIBILITY: ${{ matrix.platform.manylinux && 'manylinux_2_28' || 'pypi' }}
          PYTHON_WHEEL_INTERPRETER: ${{ matrix.platform.wheel_python }}
          PYTHON_WHEEL_FEATURES: ${{ matrix.python.wheel_features }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            just --shell "C:/Program Files/Git/bin/bash.exe" --shell-arg "-eu" --shell-arg "-o" --shell-arg "pipefail" --shell-arg "-c" py-build-release-wheel
          else
            just py-build-release-wheel
          fi

      - name: Verify Linux wheel target
        if: matrix.platform.manylinux
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*-manylinux_2_28_x86_64.whl)
          [[ "${#wheels[@]}" -eq 1 ]] || {
            echo "expected one manylinux_2_28_x86_64 wheel, found ${#wheels[@]}" >&2
            exit 1
          }

      - name: Build sdist
        if: matrix.platform.label == 'linux' && matrix.python.label == 'abi3'
        shell: bash
        run: just py-build-sdist

      - name: Upload Python candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-part-python-${{ matrix.platform.label }}-${{ matrix.python.label }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  vscode:
    name: VS Code candidate
    needs: classify
    if: needs.classify.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Package VS Code extension
        working-directory: tools/vscode-arco-kdl
        run: |
          set -euo pipefail
          npm run check
          npm run package
          cp arco-kdl-vscode-*.vsix ../../arco-kdl-vscode.vsix

      - name: Upload VS Code candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-part-vscode
          path: arco-kdl-vscode.vsix
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Assemble candidate bundle
    needs: [classify, cargo-dist, python, vscode]
    if: >-
      always() &&
      needs.classify.outputs.eligible == 'true' &&
      needs.cargo-dist.result == 'success' &&
      needs.python.result == 'success' &&
      needs.vscode.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Required by the merge action and native digest checks.
      attestations: write # Required to attest candidate subjects.
      id-token: write # Required by GitHub build provenance attestation.
    steps:
      - name: Write candidate metadata
        env:
          VERSION: ${{ needs.classify.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_MERGE_SHA: ${{ needs.cargo-dist.outputs.tested_merge_sha }}
          SOURCE_TREE: ${{ needs.cargo-dist.outputs.source_tree }}
          CANDIDATE_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: release-candidate-v${{ needs.classify.outputs.version }}-pr${{ github.event.pull_request.number }}-tree${{ needs.cargo-dist.outputs.source_tree }}
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg tag "v$VERSION" \
            --argjson pr_number "$PR_NUMBER" \
            --arg pr_head_sha "$PR_HEAD_SHA" \
            --arg tested_merge_sha "$TESTED_MERGE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --argjson candidate_run_id "$CANDIDATE_RUN_ID" \
            --arg artifact_name "$ARTIFACT_NAME" \
            '{schema_version: 1, version: $version, release_tag: $tag, pr_number: $pr_number, pr_head_sha: $pr_head_sha, tested_merge_sha: $tested_merge_sha, source_tree: $source_tree, candidate_run_id: $candidate_run_id, artifact_name: $artifact_name}' \
            > RELEASE_METADATA.json

      - name: Store candidate metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-part-metadata
          path: RELEASE_METADATA.json
          if-no-files-found: error
          retention-days: 90

      - id: candidate
        name: Merge immutable candidate bundle
        uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-v${{ needs.classify.outputs.version }}-pr${{ github.event.pull_request.number }}-tree${{ needs.cargo-dist.outputs.source_tree }}
          pattern: release-candidate-part-*
          separate-directories: true
          retention-days: 90

      - name: Download merged bundle for attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-v${{ needs.classify.outputs.version }}-pr${{ github.event.pull_request.number }}-tree${{ needs.cargo-dist.outputs.source_tree }}
          path: candidate-bundle

      - name: Validate merged candidate inventory
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          declare -A seen=()
          while IFS= read -r -d '' path; do
            name="${path##*/}"
            [[ -z "${seen[$name]+present}" ]] || { echo "duplicate release asset: ${name}" >&2; exit 1; }
            seen[$name]=present
          done < <(find candidate-bundle -type f -print0)
          one_file() {
            local pattern="$1"
            local count
            count="$(find candidate-bundle -type f -name "$pattern" | wc -l)"
            [[ "$count" -eq 1 ]] || { echo "expected one ${pattern}, found ${count}" >&2; exit 1; }
          }
          [[ "$(find candidate-bundle -type f -name '*.whl' | wc -l)" -eq 6 ]] || {
            echo "expected six Python wheels" >&2
            exit 1
          }
          one_file "arco-${VERSION}-cp310-cp310-manylinux_2_28_x86_64.whl"
          one_file "arco-${VERSION}-cp311-abi3-manylinux_2_28_x86_64.whl"
          one_file "arco-${VERSION}-cp310-cp310-macosx-*_arm64.whl"
          one_file "arco-${VERSION}-cp311-abi3-macosx-*_arm64.whl"
          one_file "arco-${VERSION}-cp310-cp310-win_amd64.whl"
          one_file "arco-${VERSION}-cp311-abi3-win_amd64.whl"
          one_file "arco-${VERSION}.tar.gz"
          [[ "$(find candidate-bundle -type f -name '*.vsix' | wc -l)" -eq 1 ]] || {
            echo "expected one VSIX" >&2
            exit 1
          }
          [[ "$(find candidate-bundle -type f -name '*dist-manifest.json' | wc -l)" -gt 0 ]] || {
            echo "Cargo-dist manifest is missing" >&2
            exit 1
          }
          [[ "$(find candidate-bundle -type f -name '*.sha256' | wc -l)" -gt 0 ]] || {
            echo "Cargo-dist checksum is missing" >&2
            exit 1
          }

      - name: Attest merged candidate bundle
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v2.2.3
        with:
          subject-path: candidate-bundle/**/*

      - name: Record GitHub artifact identity
        env:
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: |
          printf 'Candidate artifact ID: `%s`\nCandidate artifact digest: `%s`\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  candidate-check:
    name: Release candidate
    needs: [classify, cargo-dist, python, vscode, aggregate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require candidate success
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          ELIGIBLE: ${{ needs.classify.outputs.eligible }}
          CARGO_RESULT: ${{ needs.cargo-dist.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          VSCODE_RESULT: ${{ needs.vscode.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]] || { echo "candidate classifier failed" >&2; exit 1; }
          if [[ "$ELIGIBLE" != true ]]; then
            echo "not a Release Please candidate"
            exit 0
          fi
          for result in "$CARGO_RESULT" "$PYTHON_RESULT" "$VSCODE_RESULT" "$AGGREGATE_RESULT"; do
            [[ "$result" == success ]] || { echo "candidate job failed: $result" >&2; exit 1; }
          done
          echo "complete release candidate is ready for merge"
