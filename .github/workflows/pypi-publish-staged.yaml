name: Publish Staged PyPI Distributions

on:
  workflow_call:
    inputs:
      release_tag:
        description: GitHub Release tag containing staged Python distributions.
        required: true
        type: string
      tooling_ref:
        description: Git ref containing release tooling and manifest checks.
        required: false
        default: main
        type: string
      skip_existing:
        description: Skip files that already exist on PyPI.
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag containing staged Python distributions.
        required: true
        type: string
      tooling_ref:
        description: Git ref containing release tooling and manifest checks.
        required: true
        default: main
        type: string
      skip_existing:
        description: Skip files that already exist on PyPI.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pypi-publish-staged-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.9.4"

jobs:
  publish-pypi:
    name: Publish staged distributions to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Required for PyPI trusted publishing via OIDC.
    environment:
      name: pypi
      url: https://pypi.org/p/arco
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.tooling_ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Download staged distributions from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "arco-${version}-*.whl" --dir dist --clobber
          gh release download "$RELEASE_TAG" --pattern "arco-${version}.tar.gz" --dir dist --clobber

      - name: Validate staged distribution manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/ci/validate_python_distributions.py manifest --dist-dir dist --matrix-path .github/python-distribution-matrix.json --release-tag "$RELEASE_TAG"

      - name: Validate package metadata
        shell: bash
        run: uvx --from twine twine check dist/*

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
          skip-existing: ${{ inputs.skip_existing }}
