[package]
name = "tree-sitter-arco-kdl"
description = "Arco KDL grammar for the tree-sitter parsing library"
version = "0.1.0"
keywords = ["incremental", "parsing", "arco-kdl"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/NatLabRockies/arco"
edition = "2018"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "~0.20.10"

[build-dependencies]
cc = "1.0"
