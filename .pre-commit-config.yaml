default_stages:
  - pre-commit

default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: check-executables-have-shebangs

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      - id: commitizen
        stages:
          - commit-msg

  - repo: local
    hooks:
      - id: pytest
        name: pytest (quick)
        entry: just py-test
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/crate-ci/typos
    rev: v1.44.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uvx ruff check --fix --config=bindings/python/pyproject.toml
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uvx ruff format --config=bindings/python/pyproject.toml
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write --ignore-unknown
        language: node
        additional_dependencies: ["prettier@3"]
        types_or: [yaml, json5]

  - repo: local
    hooks:
      - id: zizmor
        name: zizmor
        entry: uvx zizmor .github
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.yaml$
        pass_filenames: false
        stages: [pre-push]

      - id: actionlint
        name: actionlint
        entry: uvx --from actionlint-py actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
        stages: [pre-push]
