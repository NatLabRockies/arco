[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Explicitly release only the CLI package from this workspace.
packages = ["arco-cli"]
# The preferred Rust toolchain to use in CI (rustup toolchain syntax)
rust-toolchain-version = "1.85"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Which actions to run on pull requests
pr-run-mode = "upload"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether CI should trigger releases with dispatches instead of tag pushes
dispatch-releases = true
# Build only the required packages, and individually
precise-builds = true
# Self-update is handled by `arco self update`.
install-updater = false
# Extra setup steps injected into dist build-local-artifacts jobs
github-build-setup = "../dist-build-setup.yml"

# Use a container with musl toolchain pre-installed instead of downloading from musl.cc
# The messense/rust-musl-cross image has the full musl cross-toolchain including C++
[dist.github-custom-runners.x86_64-unknown-linux-gnu]
runner = "ubuntu-22.04"

[dist.github-custom-runners.x86_64-unknown-linux-musl]
container = { image = "messense/rust-musl-cross:x86_64-musl", host = "x86_64-unknown-linux-gnu" }

[dist.github-action-commits]
"actions/checkout" = "de0fac2e4500dabe0009e67214ff5f5447ce83dd"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"swatinem/rust-cache" = "e18b497796c12c097a38f9edb9d0641fb99eee32"
