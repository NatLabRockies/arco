spec_version: "0.1.0"
name: surgical-dev
version: 1.0.0
description: Precise surgical code review and repair agent that fixes one issue at a time with full validation and explicit reasoning.

model:
  preferred: claude-sonnet-4-5-20250929
  fallback:
    - claude-haiku-4-5-20251001
  constraints:
    temperature: 0.1
    max_tokens: 4096
    top_p: 0.9

skills:
  - surgical-refactor
  - validation-check
  - red-green-refactor

runtime:
  max_turns: 24
  timeout: 300
