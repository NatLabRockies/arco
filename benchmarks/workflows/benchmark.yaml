name: arco_tool_benchmark
user: benchmark_user
description: Compare model build memory across arco, pyomo, linopy, jump, pyoptinterface, and pulp

resource_monitor:
  enabled: true
  granularity: summary
  sample_interval_seconds: 2

jobs:
  - name: bench_{tool}_{phase}_n{n}
    command: |
      bash -lc '
      mkdir -p results/raw
      out="results/raw/{tool}_{phase}_n{n}.json"
      if [ "{tool}" = "jump" ]; then
        bash scripts/run_jump_point.sh --phase {phase} --n {n} --solver highs --out "$out"
      else
        uv run python scripts/run_python_point.py --tool {tool} --phase {phase} --n {n} --solver highs --out "$out"
      fi
      '
    parameters:
      tool: "['pyomo','linopy','arco','jump','pyoptinterface','pulp']"
      phase: "['build']"
      n: "[10,20,50,100,200,300,400,500,600,800]"
    resource_requirements: local_benchmark

files: []
user_data: []

resource_requirements:
  - name: local_benchmark
    num_cpus: 4
    num_gpus: 0
    num_nodes: 1
    memory: 24g
    runtime: PT2H
