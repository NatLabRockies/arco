[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "arco-benchmarks"
version = "0.1.0"
description = "Torc-orchestrated benchmark suite for optimization model builders"
readme = "BENCHMARK.md"
requires-python = ">=3.12"
dependencies = [
  "arco",
  "highspy>=1.10.0",
  "linopy>=0.4.0",
  "matplotlib>=3.9.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "pulp>=3.0.0",
  "pyoptinterface[highs]>=0.5.0",
  "pyomo>=6.8.0",
  "pyyaml>=6.0.0",
  "seaborn>=0.13.0",
]

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"

[tool.mypy]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/arco_benchmarks"]

[tool.uv.sources]
arco = { path = "../bindings/python", editable = true }
