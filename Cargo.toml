[workspace]
members = ["crates/*", "bindings/python"]
exclude = ["scripts"]
default-members = [
    "crates/arco-bench",
    "crates/arco-blocks",
    "crates/arco-cli",
    "crates/arco-core",
    "crates/arco-expr",
    "crates/arco-highs",
    "crates/arco-kdl",
    "crates/arco-solver",
    "crates/arco-tools",
    "crates/arco-xpress",
]
resolver = "3"

[workspace.dependencies]
tracing = "0.1"
serde_json = "1.0"
sysinfo = "0.33"
pyo3 = "0.28"
tracing-subscriber = "0.3"
smallvec = "1"
arco-core = { path = "crates/arco-core" }
arco-expr = { path = "crates/arco-expr" }
arco-solver = { path = "crates/arco-solver" }
arco-highs = { path = "crates/arco-highs" }
arco-ipopt = { path = "crates/arco-ipopt" }
arco-xpress = { path = "crates/arco-xpress" }
arco-tools = { path = "crates/arco-tools" }
arco-blocks = { path = "crates/arco-blocks" }
arco-kdl = { path = "crates/arco-kdl" }
arco-cli = { path = "crates/arco-cli" }

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.85"
license-file = "licenses/BSD-3-Clause.txt"
authors = [
    "pesap <pesap@users.noreply.github.com>",
]
description = "Workspace for the Arco multi-language bindings"
homepage = "https://github.com/pesap/arco"
repository = "https://github.com/pesap/arco"

[workspace.metadata.dist]
# The preferred dist version to use in CI
cargo-dist-version = "0.31.0"
# Explicitly release only the CLI package from this workspace.
packages = ["arco-cli"]
# The preferred Rust toolchain to use in CI (Rustup must be able to install it)
rust-toolchain-version = "1.85"
# CI backends to support
ci = ["github"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should fetch packages from
install-path = "CARGO_HOME"
# Whether to install an updater program
auto-updater = true
# Use workflow_dispatch instead of tag-push triggers.
# release-please owns tag/release creation; dist builds and uploads artifacts.
dispatch-releases = true
# Build per package instead of `--workspace` to avoid compiling non-release crates.
precise-builds = true
# Protect hand-edits to generated CI workflow from being overwritten.
allow-dirty = ["ci"]

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
# Enable pedantic lints for stricter code quality
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
similar_names = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
items_after_statements = "allow"
uninlined_format_args = "allow"
return_self_not_must_use = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
default_trait_access = "allow"
match_same_arms = "allow"
unused_async = "allow"
manual_let_else = "allow"
used_underscore_binding = "allow"
ref_option_ref = "allow"
format_push_string = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnecessary_wraps = "deny"
needless_pass_by_value = "allow"
trivially_copy_pass_by_ref = "allow"
no_effect_underscore_binding = "allow"
redundant_closure_for_method_calls = "allow"
result_large_err = "allow"

# No debug macros in production
dbg_macro = "deny"

# No incomplete code markers
todo = "deny"
unimplemented = "deny"

[profile.dist]
inherits = "release"
lto = "thin"
